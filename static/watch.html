<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream - Portal Gateway</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=23">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(0,0,0,0.95);
            overflow: hidden;
        }

        .viewer-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .viewer-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .viewer-header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .viewer-header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-primary);
        }

        .stream-broadcaster {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stream-broadcaster-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
        }

        .viewer-header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--accent-red);
            color: white;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .live-indicator .pulse {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .viewer-count {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .viewer-count svg {
            width: 16px;
            height: 16px;
        }

        .viewer-close {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background 0.2s;
        }

        .viewer-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .viewer-video-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        .viewer-video {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }

        .viewer-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .stream-offline {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            padding: 2rem;
        }

        .stream-offline svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .stream-offline p {
            margin: 0;
            font-size: 1rem;
        }

        /* Player stats overlay */
        .player-stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 0.75rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            color: #0f0;
            z-index: 10;
            min-width: 180px;
            display: none;
        }

        .player-stats.visible {
            display: block;
        }

        .player-stats .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 2px 0;
        }

        .player-stats .stat-row span:first-child {
            color: #888;
        }

        /* Player controls bar */
        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .player-control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .player-control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .player-control-group select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-primary);
            padding: 0.3rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .player-control-group select:hover {
            border-color: var(--accent-blue);
        }

        .fullscreen-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-primary);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
        }

        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: var(--accent-blue);
        }

        /* Fullscreen styles */
        .viewer-video-wrapper:fullscreen,
        .viewer-video-wrapper:-webkit-full-screen {
            background: #000;
        }

        .viewer-video-wrapper:fullscreen .viewer-video,
        .viewer-video-wrapper:-webkit-full-screen .viewer-video {
            flex: 1;
        }

        .viewer-video-wrapper:fullscreen .player-controls,
        .viewer-video-wrapper:-webkit-full-screen .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .viewer-video-wrapper:fullscreen:hover .player-controls,
        .viewer-video-wrapper:-webkit-full-screen:hover .player-controls {
            opacity: 1;
        }

        /* Chat sidebar */
        .viewer-chat {
            width: 350px;
            background: var(--bg-secondary);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .viewer-chat-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewer-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .chat-message {
            padding: 0.5rem;
            border-radius: 6px;
            background: rgba(0,0,0,0.2);
        }

        .chat-username {
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 0.85rem;
            margin-right: 0.5rem;
        }

        .chat-text {
            color: var(--text-primary);
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .viewer-chat-input {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .viewer-chat-input input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .viewer-chat-input input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .viewer-chat-input button {
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .viewer-chat-input button:hover {
            background: #2563eb;
        }

        /* Mobile responsive */
        @media (max-width: 900px) {
            .viewer-chat {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 100;
            }

            .viewer-chat.open {
                transform: translateX(0);
            }

            .chat-toggle-btn {
                display: flex !important;
            }
        }

        .chat-toggle-btn {
            display: none;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-primary);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
        }

        .chat-toggle-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="viewer-main">
            <div class="viewer-header">
                <div class="viewer-header-info">
                    <h2 id="viewer-title">Loading...</h2>
                    <div class="stream-broadcaster">
                        <div class="stream-broadcaster-avatar" id="viewer-avatar">?</div>
                        <span id="viewer-broadcaster">Loading...</span>
                    </div>
                </div>
                <div class="viewer-header-right">
                    <div class="live-indicator" id="live-indicator" style="display: none;">
                        <span class="pulse"></span>LIVE
                    </div>
                    <div class="viewer-count" id="viewer-count" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <span id="viewer-count-value">0</span>
                    </div>
                    <button class="chat-toggle-btn" onclick="toggleChat()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        Chat
                    </button>
                    <button class="viewer-close" onclick="window.close()" title="Close">&times;</button>
                </div>
            </div>
            <div class="viewer-video-wrapper" id="video-wrapper">
                <div class="viewer-video" id="video-container">
                    <video id="stream-video" controls autoplay></video>
                </div>
                <div id="player-stats" class="player-stats">
                    <div class="stat-row"><span>Resolution:</span><span id="stat-resolution">--</span></div>
                    <div class="stat-row"><span>Framerate:</span><span id="stat-framerate">--</span></div>
                    <div class="stat-row"><span>Codec:</span><span id="stat-codec">--</span></div>
                    <div class="stat-row"><span>Bitrate:</span><span id="stat-bitrate">--</span></div>
                    <div class="stat-row"><span>Buffer:</span><span id="stat-buffer">--</span></div>
                    <div class="stat-row"><span>Latency:</span><span id="stat-latency">--</span></div>
                    <div class="stat-row"><span>Dropped:</span><span id="stat-dropped">--</span></div>
                </div>
                <div class="player-controls">
                    <div class="player-control-group">
                        <label>Quality:</label>
                        <select id="quality-selector" onchange="changeQuality(this.value)">
                            <option value="-1">Auto</option>
                        </select>
                    </div>
                    <div class="player-control-group">
                        <label>Buffer:</label>
                        <select id="buffer-selector" onchange="changeBuffer(this.value)">
                            <option value="low">Low Latency</option>
                            <option value="normal" selected>Normal</option>
                            <option value="high">Stable</option>
                        </select>
                    </div>
                    <div class="player-control-group">
                        <button class="btn btn-sm btn-secondary" onclick="toggleStats()">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                            Stats
                        </button>
                    </div>
                    <div class="player-control-group" style="margin-left: auto;">
                        <button class="fullscreen-btn" onclick="toggleFullscreen()">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                            </svg>
                            Fullscreen
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="viewer-chat" id="viewer-chat">
            <div class="viewer-chat-header">
                <span>Stream Chat</span>
            </div>
            <div class="viewer-chat-messages" id="chat-messages"></div>
            <form class="viewer-chat-input" onsubmit="sendChatMessage(event)">
                <input type="text" id="chat-input" placeholder="Send a message..." autocomplete="off">
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script src="/static/js/portal.js?v=21"></script>
    <script>
        let streamId = null;
        let streamData = null;
        let chatWs = null;
        let hlsPlayer = null;
        let statsInterval = null;

        // HLS buffer presets
        const bufferPresets = {
            low: {
                liveSyncDurationCount: 2,
                liveMaxLatencyDurationCount: 4,
                liveDurationInfinity: false,
                highBufferWatchdogPeriod: 1
            },
            normal: {
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: 6,
                liveDurationInfinity: false,
                highBufferWatchdogPeriod: 2
            },
            high: {
                liveSyncDurationCount: 5,
                liveMaxLatencyDurationCount: 10,
                liveDurationInfinity: true,
                highBufferWatchdogPeriod: 3
            }
        };

        // Get stream ID from URL
        const pathParts = window.location.pathname.split('/');
        streamId = pathParts[pathParts.length - 1];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadStream();
        });

        async function loadStream() {
            try {
                const response = await fetch(`/api/streams/${streamId}`, { credentials: 'include' });
                const data = await response.json();
                streamData = data.stream;

                if (!streamData) {
                    document.getElementById('viewer-title').textContent = 'Stream not found';
                    return;
                }

                document.title = `${streamData.name} - Portal Gateway`;
                document.getElementById('viewer-title').textContent = streamData.name;
                document.getElementById('viewer-broadcaster').textContent = streamData.owner_username || 'Unknown';
                document.getElementById('viewer-avatar').textContent = (streamData.owner_username || '?')[0].toUpperCase();

                if (streamData.is_live) {
                    document.getElementById('live-indicator').style.display = 'flex';
                    document.getElementById('viewer-count').style.display = 'flex';
                    document.getElementById('viewer-count-value').textContent = streamData.viewer_count || 0;

                    // Set up video
                    setupVideo();

                    // Connect to chat
                    const chatKey = streamData.public_key || streamData.stream_key;
                    if (chatKey) {
                        connectChat(chatKey);
                    }
                } else {
                    showOfflineMessage();
                }

                // Periodically refresh stream info
                setInterval(refreshStreamInfo, 15000);

            } catch (error) {
                console.error('Failed to load stream:', error);
                document.getElementById('viewer-title').textContent = 'Error loading stream';
            }
        }

        function showOfflineMessage() {
            document.getElementById('video-container').innerHTML = `
                <div class="stream-offline">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                    </svg>
                    <p>This stream is currently offline</p>
                </div>
            `;
            document.getElementById('live-indicator').style.display = 'none';
            document.getElementById('viewer-count').style.display = 'none';
        }

        function getHlsConfig(bufferSetting) {
            const preset = bufferPresets[bufferSetting] || bufferPresets.normal;
            return {
                enableWorker: true,
                lowLatencyMode: bufferSetting === 'low',
                backBufferLength: 30,
                ...preset
            };
        }

        function setupVideo() {
            const video = document.getElementById('stream-video');
            const viewKey = streamData.public_key || streamData.stream_key;
            const hlsUrl = `/api/stream/${viewKey}/hls/index.m3u8`;

            // Reset quality selector
            const qualitySelect = document.getElementById('quality-selector');
            qualitySelect.innerHTML = '<option value="-1">Auto</option>';

            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (Safari) - limited controls
                video.src = hlsUrl;
                document.querySelector('.player-controls').style.display = 'none';
            } else if (Hls.isSupported()) {
                // Use hls.js with configurable settings
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }

                const bufferSetting = document.getElementById('buffer-selector').value;
                const hlsConfig = getHlsConfig(bufferSetting);

                hlsPlayer = new Hls(hlsConfig);
                hlsPlayer.loadSource(hlsUrl);
                hlsPlayer.attachMedia(video);

                // Listen for manifest parsed to get quality levels
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    populateQualityLevels(data.levels);
                });

                // Listen for level switched
                hlsPlayer.on(Hls.Events.LEVEL_SWITCHED, (event, data) => {
                    updateQualityIndicator(data.level);
                });

                hlsPlayer.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        console.error('HLS error:', data);
                    }
                });
            } else {
                console.error('HLS not supported');
            }
        }

        function populateQualityLevels(levels) {
            const select = document.getElementById('quality-selector');
            select.innerHTML = '<option value="-1">Auto</option>';

            levels.forEach((level, index) => {
                const height = level.height;
                const bitrate = Math.round(level.bitrate / 1000);
                const label = height ? `${height}p (${bitrate} kbps)` : `${bitrate} kbps`;
                const option = document.createElement('option');
                option.value = index;
                option.textContent = label;
                select.appendChild(option);
            });
        }

        function updateQualityIndicator(level) {
            const select = document.getElementById('quality-selector');
            if (select.value === '-1' && hlsPlayer) {
                const autoOption = select.options[0];
                const levels = hlsPlayer.levels;
                if (levels && levels[level]) {
                    const height = levels[level].height;
                    autoOption.textContent = height ? `Auto (${height}p)` : 'Auto';
                }
            }
        }

        function changeQuality(level) {
            if (!hlsPlayer) return;

            level = parseInt(level);
            if (level === -1) {
                hlsPlayer.currentLevel = -1;
                hlsPlayer.loadLevel = -1;
            } else {
                hlsPlayer.currentLevel = level;
            }
        }

        function changeBuffer(setting) {
            if (!hlsPlayer || !streamData) return;

            // Recreate HLS player with new settings
            const currentTime = document.getElementById('stream-video').currentTime;
            setupVideo();
        }

        function toggleStats() {
            const stats = document.getElementById('player-stats');
            stats.classList.toggle('visible');

            if (stats.classList.contains('visible')) {
                startStatsUpdates();
            } else {
                stopStatsUpdates();
            }
        }

        function startStatsUpdates() {
            if (statsInterval) return;

            statsInterval = setInterval(() => {
                if (!hlsPlayer) return;

                const video = document.getElementById('stream-video');
                const levels = hlsPlayer.levels;
                const currentLevel = hlsPlayer.currentLevel;

                if (levels && levels[currentLevel]) {
                    const level = levels[currentLevel];
                    document.getElementById('stat-resolution').textContent = `${level.width}x${level.height}`;
                    document.getElementById('stat-codec').textContent = level.videoCodec || '--';
                    document.getElementById('stat-bitrate').textContent = `${Math.round(level.bitrate / 1000)} kbps`;
                }

                // Buffer info
                if (video.buffered.length > 0) {
                    const buffered = video.buffered.end(video.buffered.length - 1) - video.currentTime;
                    document.getElementById('stat-buffer').textContent = `${buffered.toFixed(2)}s`;
                }

                // Latency (estimate based on buffer)
                if (hlsPlayer.latency !== undefined) {
                    document.getElementById('stat-latency').textContent = `${hlsPlayer.latency.toFixed(2)}s`;
                }

                // Dropped frames
                if (video.getVideoPlaybackQuality) {
                    const quality = video.getVideoPlaybackQuality();
                    document.getElementById('stat-dropped').textContent = quality.droppedVideoFrames;
                    const fps = quality.totalVideoFrames / video.currentTime;
                    document.getElementById('stat-framerate').textContent = `${fps.toFixed(1)} fps`;
                }
            }, 1000);
        }

        function stopStatsUpdates() {
            if (statsInterval) {
                clearInterval(statsInterval);
                statsInterval = null;
            }
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('video-wrapper');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                wrapper.requestFullscreen();
            }
        }

        async function refreshStreamInfo() {
            try {
                const response = await fetch(`/api/streams/${streamId}`, { credentials: 'include' });
                const data = await response.json();
                streamData = data.stream;

                if (streamData.is_live) {
                    document.getElementById('live-indicator').style.display = 'flex';
                    document.getElementById('viewer-count').style.display = 'flex';
                    document.getElementById('viewer-count-value').textContent = streamData.viewer_count || 0;
                } else {
                    showOfflineMessage();
                    if (hlsPlayer) {
                        hlsPlayer.destroy();
                        hlsPlayer = null;
                    }
                }
            } catch (error) {
                console.error('Failed to refresh stream info:', error);
            }
        }

        function connectChat(streamKey) {
            if (chatWs) {
                chatWs.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat`;
            chatWs = new WebSocket(wsUrl);

            chatWs.onopen = () => {
                chatWs.send(JSON.stringify({
                    type: 'join',
                    stream_key: streamKey
                }));
            };

            chatWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'message') {
                    appendChatMessage(data);
                } else if (data.type === 'history') {
                    document.getElementById('chat-messages').innerHTML = '';
                    data.messages.forEach(msg => appendChatMessage(msg));
                }
            };

            chatWs.onclose = () => {
                chatWs = null;
                // Reconnect after a delay
                setTimeout(() => {
                    if (streamData && streamData.is_live) {
                        const chatKey = streamData.public_key || streamData.stream_key;
                        if (chatKey) connectChat(chatKey);
                    }
                }, 3000);
            };

            chatWs.onerror = (error) => {
                console.error('Chat WebSocket error:', error);
            };
        }

        function appendChatMessage(msg) {
            const messagesEl = document.getElementById('chat-messages');
            const messageEl = document.createElement('div');
            messageEl.className = 'chat-message';
            messageEl.innerHTML = `
                <span class="chat-username">${escapeHtml(msg.username)}</span>
                <span class="chat-text">${escapeHtml(msg.message)}</span>
            `;
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function sendChatMessage(event) {
            event.preventDefault();

            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message || !chatWs) return;

            chatWs.send(JSON.stringify({
                type: 'message',
                message: message
            }));

            input.value = '';
        }

        function toggleChat() {
            document.getElementById('viewer-chat').classList.toggle('open');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Clean up on close
        window.addEventListener('beforeunload', () => {
            if (chatWs) chatWs.close();
            if (hlsPlayer) hlsPlayer.destroy();
            stopStatsUpdates();
        });
    </script>
</body>
</html>
