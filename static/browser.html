<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{SERVICE_NAME}} - Open Relay Portal</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=41">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg-primary, #0d1117);
            color: var(--text-primary, #c9d1d9);
        }
        .browser-header {
            display: flex;
            align-items: center;
            height: 50px;
            padding: 0 12px;
            background: var(--card-bg, #161b22);
            border-bottom: 1px solid var(--card-border, #30363d);
            gap: 8px;
            flex-shrink: 0;
        }
        .browser-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .browser-title svg {
            width: 20px;
            height: 20px;
            color: var(--accent-blue, #58a6ff);
            flex-shrink: 0;
        }
        .browser-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .browser-nav button {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-secondary, #8b949e);
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .browser-nav button:hover {
            background: var(--bg-secondary, #1c2128);
            border-color: var(--card-border, #30363d);
            color: var(--text-primary, #c9d1d9);
        }
        .browser-nav button:active {
            background: var(--card-border, #30363d);
        }
        .browser-nav button:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .browser-nav button:disabled:hover {
            background: transparent;
            border-color: transparent;
        }
        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-primary, #0d1117);
            border: 1px solid var(--card-border, #30363d);
            border-radius: 8px;
            padding: 0 10px;
            height: 32px;
            min-width: 0;
            transition: border-color 0.15s;
        }
        .url-bar:focus-within {
            border-color: var(--accent-blue, #58a6ff);
        }
        .url-bar .lock-icon {
            color: var(--accent-green, #3fb950);
            flex-shrink: 0;
            margin-right: 6px;
        }
        .url-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary, #c9d1d9);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.8rem;
            outline: none;
            min-width: 0;
        }
        .url-bar input::placeholder {
            color: var(--text-muted, #484f58);
        }
        .browser-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .browser-controls .connection-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
        }
        .browser-controls .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .connection-status.connected .status-dot {
            background: var(--accent-green, #3fb950);
            box-shadow: 0 0 6px var(--accent-green, #3fb950);
        }
        .connection-status.connecting .status-dot {
            background: var(--accent-orange, #d29922);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .connection-status.disconnected .status-dot {
            background: var(--accent-red, #f85149);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Tab bar */
        .tab-bar {
            display: flex;
            align-items: flex-end;
            background: var(--bg-primary, #0d1117);
            border-bottom: 1px solid var(--card-border, #30363d);
            height: 36px;
            padding: 0 4px;
            gap: 2px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 12px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-secondary, #8b949e);
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            max-width: 200px;
            min-width: 60px;
            flex-shrink: 0;
            transition: all 0.15s;
            user-select: none;
        }
        .tab:hover {
            background: var(--bg-secondary, #1c2128);
            color: var(--text-primary, #c9d1d9);
        }
        .tab.active {
            background: var(--card-bg, #161b22);
            border-color: var(--card-border, #30363d);
            color: var(--text-primary, #c9d1d9);
        }
        .tab .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .tab .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.1s, background 0.1s;
            flex-shrink: 0;
        }
        .tab:hover .tab-close, .tab.active .tab-close {
            opacity: 0.6;
        }
        .tab .tab-close:hover {
            opacity: 1;
            background: rgba(248,81,73,0.2);
            color: var(--accent-red, #f85149);
        }
        .tab-new {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-secondary, #8b949e);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .tab-new:hover {
            background: var(--bg-secondary, #1c2128);
            color: var(--text-primary, #c9d1d9);
        }

        .frame-container {
            position: relative;
            flex: 1;
            overflow: hidden;
        }
        .frame-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .frame-container iframe.hidden-tab {
            visibility: hidden;
            pointer-events: none;
        }
        .browser-error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 16px;
            padding: 2rem;
        }
        .browser-error svg {
            width: 48px;
            height: 48px;
            color: var(--text-muted, #484f58);
        }
        .browser-error h2 {
            font-size: 1.2rem;
            color: var(--text-primary, #c9d1d9);
            margin: 0;
        }
        .browser-error p {
            color: var(--text-secondary, #8b949e);
            margin: 0;
            max-width: 400px;
        }
        /* Full-height layout */
        body {
            display: flex;
            flex-direction: column;
        }
        /* Responsive */
        @media (max-width: 600px) {
            .browser-header {
                gap: 4px;
                padding: 0 8px;
            }
            .browser-title span {
                display: none;
            }
            .browser-controls #status-text {
                display: none;
            }
            .tab { max-width: 120px; padding: 0 8px; }
        }
    </style>
</head>
<body>
    <header class="browser-header">
        <div class="browser-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
            </svg>
            <span id="service-name">{{SERVICE_NAME}}</span>
        </div>

        <div class="browser-nav">
            <button id="btn-back" onclick="goBack()" title="Back" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="btn-forward" onclick="goForward()" title="Forward" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <button id="btn-refresh" onclick="refreshPage()" title="Refresh">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <div class="url-bar">
            <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="text" id="url-input" value="{{TARGET_DISPLAY}}" placeholder="Loading..." spellcheck="false" autocomplete="off">
        </div>

        <div class="browser-controls">
            <div class="connection-status connecting" id="connection-status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting</span>
            </div>
            <button class="btn btn-secondary" onclick="openExternal()" title="Open in new tab" style="padding:4px 6px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </button>
            <button class="btn btn-secondary" onclick="disconnect()" title="Disconnect" style="padding:4px 6px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </header>

    <div class="tab-bar" id="tab-bar">
        <button class="tab-new" onclick="addTab()" title="New Tab (Ctrl+T)">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>

    <div class="frame-container" id="frame-container">
        <div class="browser-error" id="browser-error">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.072 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
            <h2>Connection Failed</h2>
            <p id="error-message">Could not reach the upstream service. Check that the target host is running and accessible.</p>
            <button class="btn btn-primary" onclick="reconnect()">Retry Connection</button>
        </div>
    </div>

    <script src="/static/js/portal.js?v=33"></script>
    <script>
        const connectionId = '{{CONNECTION_ID}}';
        const proxyBase = '{{PROXY_PATH}}';
        const targetDisplay = '{{TARGET_DISPLAY}}';
        const browserMode = {{BROWSER_MODE}};
        const urlInput = document.getElementById('url-input');
        const statusEl = document.getElementById('connection-status');
        const statusTextEl = document.getElementById('status-text');
        const errorEl = document.getElementById('browser-error');
        const tabBar = document.getElementById('tab-bar');
        const frameContainer = document.getElementById('frame-container');

        // Tab state
        let tabs = [];
        let activeTabId = null;
        let tabIdCounter = 0;
        let urlPollInterval = null;

        function setStatus(state, text) {
            statusEl.className = 'connection-status ' + state;
            statusTextEl.textContent = text;
        }

        function getHomeSrc() {
            return proxyBase + '/';
        }

        function proxyPathToDisplay(proxyUrl) {
            try {
                const url = new URL(proxyUrl, window.location.origin);
                const path = url.pathname;
                const prefix = proxyBase + '/';
                if (browserMode) {
                    if (path.startsWith(prefix)) {
                        const remainder = path.slice(prefix.length);
                        if (remainder.match(/^https?:\/\//)) {
                            let display = remainder;
                            if (url.search) display += url.search;
                            if (url.hash) display += url.hash;
                            return display;
                        }
                    }
                    return targetDisplay + '/';
                }
                if (path.startsWith(prefix)) {
                    return targetDisplay + '/' + path.slice(prefix.length);
                } else if (path === proxyBase) {
                    return targetDisplay + '/';
                }
            } catch {}
            return targetDisplay + '/';
        }

        function displayToProxyPath(display) {
            if (browserMode) {
                if (display.startsWith('http://') || display.startsWith('https://'))
                    return proxyBase + '/' + display;
                if (display.match(/^[a-zA-Z0-9][a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/))
                    return proxyBase + '/https://' + display;
                if (display.startsWith('/'))
                    return proxyBase + '/' + targetDisplay + display;
                return proxyBase + '/' + display;
            }
            if (display.startsWith(targetDisplay)) {
                return proxyBase + '/' + display.slice(targetDisplay.length).replace(/^\/+/, '');
            }
            if (display.startsWith('/')) {
                return proxyBase + display;
            }
            return proxyBase + '/' + display;
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId);
        }

        function getActiveFrame() {
            const tab = getActiveTab();
            return tab ? tab.iframe : null;
        }

        // --- Tab title extraction ---
        function extractTitle(iframe) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (doc && doc.title) return doc.title.substring(0, 40);
            } catch {}
            // Fallback: extract hostname from URL
            try {
                const loc = iframe.contentWindow.location;
                const path = loc.pathname;
                const prefix = proxyBase + '/';
                if (path.startsWith(prefix)) {
                    const remainder = path.slice(prefix.length);
                    const m = remainder.match(/^https?:\/\/([^/]+)/);
                    if (m) return m[1];
                }
            } catch {}
            return 'New Tab';
        }

        // --- Tab management ---
        function addTab(url) {
            const id = ++tabIdCounter;
            const iframe = document.createElement('iframe');
            iframe.className = 'hidden-tab';
            iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox';
            iframe.src = url || getHomeSrc();
            frameContainer.appendChild(iframe);

            const tab = { id, iframe, title: 'New Tab' };
            tabs.push(tab);

            // Listen for load events to update title + catch escaped navigation
            iframe.addEventListener('load', function() {
                // Safety net: if iframe navigated outside proxy path, redirect back through proxy
                if (browserMode) {
                    try {
                        const href = iframe.contentWindow.location.href;
                        const iframePath = iframe.contentWindow.location.pathname;
                        if (!iframePath.startsWith(proxyBase + '/')) {
                            // Navigation escaped the proxy — reconstruct target URL
                            const escaped = iframe.contentWindow.location.pathname +
                                iframe.contentWindow.location.search +
                                iframe.contentWindow.location.hash;
                            // Get the current target origin from the tab's last known good URL
                            const curSrc = iframe.src || '';
                            const prefix = proxyBase + '/';
                            let curOrigin = '';
                            const srcIdx = curSrc.indexOf(prefix);
                            if (srcIdx >= 0) {
                                const remainder = curSrc.slice(curSrc.indexOf(prefix) + prefix.length);
                                const m = remainder.match(/^(https?:\/\/[^/]+)/);
                                if (m) curOrigin = m[1];
                            }
                            if (!curOrigin) curOrigin = 'https://' + targetDisplay.replace(/^https?:\/\//, '');
                            iframe.src = proxyBase + '/' + curOrigin + escaped;
                            return;
                        }
                    } catch(e) { /* cross-origin, ignore */ }
                }
                tab.title = extractTitle(iframe);
                renderTabs();
                if (tab.id === activeTabId) {
                    onActiveTabLoad();
                }
            });

            iframe.addEventListener('error', function() {
                if (tab.id === activeTabId) {
                    setStatus('disconnected', 'Error');
                    errorEl.style.display = 'flex';
                }
            });

            switchTab(id);
            renderTabs();
            return id;
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            if (tabs.length === 1) {
                // Last tab — navigate home instead of closing
                tabs[0].iframe.src = getHomeSrc();
                return;
            }
            const tab = tabs[idx];
            tab.iframe.remove();
            tabs.splice(idx, 1);

            if (activeTabId === id) {
                // Switch to adjacent tab
                const newIdx = Math.min(idx, tabs.length - 1);
                switchTab(tabs[newIdx].id);
            }
            renderTabs();
        }

        function switchTab(id) {
            activeTabId = id;
            tabs.forEach(t => {
                if (t.id === id) {
                    t.iframe.classList.remove('hidden-tab');
                } else {
                    t.iframe.classList.add('hidden-tab');
                }
            });
            errorEl.style.display = 'none';
            updateUrlBar();
            renderTabs();
        }

        function renderTabs() {
            // Remove old tab elements (keep the + button)
            const newBtn = tabBar.querySelector('.tab-new');
            tabBar.querySelectorAll('.tab').forEach(el => el.remove());

            tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
                el.innerHTML = `<span class="tab-title">${escapeHtml(tab.title)}</span>` +
                    `<span class="tab-close" title="Close tab">` +
                    `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="12" height="12">` +
                    `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></span>`;

                el.addEventListener('click', (e) => {
                    if (e.target.closest('.tab-close')) {
                        e.stopPropagation();
                        closeTab(tab.id);
                    } else {
                        switchTab(tab.id);
                    }
                });

                // Middle-click to close
                el.addEventListener('mousedown', (e) => {
                    if (e.button === 1) {
                        e.preventDefault();
                        closeTab(tab.id);
                    }
                });

                tabBar.insertBefore(el, newBtn);
            });
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // --- URL bar + navigation ---
        function updateUrlBar() {
            const frame = getActiveFrame();
            if (!frame) return;
            try {
                const loc = frame.contentWindow.location;
                const path = loc.pathname + loc.search + loc.hash;
                urlInput.value = proxyPathToDisplay(path);
            } catch {}

            // Update tab title
            const tab = getActiveTab();
            if (tab) {
                const newTitle = extractTitle(frame);
                if (newTitle !== tab.title) {
                    tab.title = newTitle;
                    renderTabs();
                }
            }
        }

        function startUrlPolling() {
            if (urlPollInterval) clearInterval(urlPollInterval);
            urlPollInterval = setInterval(updateUrlBar, 500);
        }

        function stopUrlPolling() {
            if (urlPollInterval) {
                clearInterval(urlPollInterval);
                urlPollInterval = null;
            }
        }

        function onActiveTabLoad() {
            const frame = getActiveFrame();
            if (!frame) return;
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (doc && doc.title && doc.title.includes('Cannot reach')) {
                    setStatus('disconnected', 'Error');
                    errorEl.style.display = 'flex';
                    return;
                }
                setStatus('connected', 'Connected');
                updateUrlBar();
                startUrlPolling();

                doc.addEventListener('click', function() {
                    setTimeout(updateUrlBar, 100);
                });
                frame.contentWindow.addEventListener('popstate', function() {
                    setTimeout(updateUrlBar, 50);
                });
            } catch {
                setStatus('connected', 'Connected');
            }
        }

        // Navigation
        function goBack() {
            const frame = getActiveFrame();
            if (!frame) return;
            try { frame.contentWindow.history.back(); } catch {}
        }

        function goForward() {
            const frame = getActiveFrame();
            if (!frame) return;
            try { frame.contentWindow.history.forward(); } catch {}
        }

        function refreshPage() {
            const frame = getActiveFrame();
            if (!frame) return;
            try { frame.contentWindow.location.reload(); } catch {
                frame.src = frame.src;
            }
        }

        function navigateTo(display) {
            const frame = getActiveFrame();
            if (!frame) return;
            frame.src = displayToProxyPath(display);
        }

        function openExternal() {
            if (browserMode) {
                const display = urlInput.value;
                if (display.startsWith('http://') || display.startsWith('https://'))
                    window.open(display, '_blank');
                else
                    window.open('https://' + display, '_blank');
                return;
            }
            const frame = getActiveFrame();
            try {
                window.open(frame.contentWindow.location.href, '_blank');
            } catch {
                if (frame) window.open(frame.src, '_blank');
            }
        }

        function disconnect() {
            stopUrlPolling();
            tabs.forEach(t => t.iframe.src = 'about:blank');
            setStatus('disconnected', 'Disconnected');
            window.close();
            setTimeout(() => { window.location.href = '/dashboard'; }, 200);
        }

        function reconnect() {
            errorEl.style.display = 'none';
            const frame = getActiveFrame();
            if (frame) frame.src = getHomeSrc();
            setStatus('connecting', 'Connecting');
        }

        // Open a URL in a new tab (called from JS interceptor via postMessage)
        window.addEventListener('message', function(e) {
            if (e.origin !== window.location.origin) return;
            if (e.data && e.data.type === 'openTab' && e.data.url) {
                var url = e.data.url;
                if (typeof url !== 'string' || !url.startsWith(proxyBase + '/')) return;
                addTab(url);
            }
        });

        // URL bar keyboard nav
        urlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigateTo(this.value);
                this.blur();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                updateUrlBar();
                this.blur();
            }
        });

        urlInput.addEventListener('focus', function() {
            setTimeout(() => this.select(), 0);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
            if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'r' && document.activeElement.tagName !== 'IFRAME') {
                e.preventDefault();
                refreshPage();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                e.preventDefault();
                urlInput.focus();
            }
            // Ctrl+T = new tab
            if ((e.ctrlKey || e.metaKey) && e.key === 't') {
                e.preventDefault();
                addTab();
            }
            // Ctrl+W = close tab
            if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                e.preventDefault();
                if (activeTabId) closeTab(activeTabId);
            }
            // Ctrl+Tab / Ctrl+Shift+Tab = next/prev tab
            if ((e.ctrlKey || e.metaKey) && e.key === 'Tab') {
                e.preventDefault();
                const idx = tabs.findIndex(t => t.id === activeTabId);
                if (e.shiftKey) {
                    switchTab(tabs[(idx - 1 + tabs.length) % tabs.length].id);
                } else {
                    switchTab(tabs[(idx + 1) % tabs.length].id);
                }
            }
        });

        // Initialize with first tab
        setStatus('connecting', 'Connecting');
        addTab();
    </script>
</body>
</html>
