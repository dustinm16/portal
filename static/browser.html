<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{SERVICE_NAME}} - Open Relay Portal</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=56">
    <script src="/static/js/theme.js?v=3"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg-primary, #0d1117);
            color: var(--text-primary, #c9d1d9);
        }
        .browser-header {
            display: flex;
            align-items: center;
            height: 50px;
            padding: 0 12px;
            background: var(--card-bg, #161b22);
            border-bottom: 1px solid var(--card-border, #30363d);
            gap: 8px;
            flex-shrink: 0;
        }
        .browser-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .browser-title svg {
            width: 20px;
            height: 20px;
            color: var(--accent-blue, #58a6ff);
            flex-shrink: 0;
        }
        .browser-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .browser-nav button {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-secondary, #8b949e);
            cursor: pointer;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .browser-nav button:hover {
            background: var(--bg-secondary, #1c2128);
            border-color: var(--card-border, #30363d);
            color: var(--text-primary, #c9d1d9);
        }
        .browser-nav button:active {
            background: var(--card-border, #30363d);
        }
        .browser-nav button:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .browser-nav button:disabled:hover {
            background: transparent;
            border-color: transparent;
        }
        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-primary, #0d1117);
            border: 1px solid var(--card-border, #30363d);
            border-radius: 8px;
            padding: 0 10px;
            height: 32px;
            min-width: 0;
            transition: border-color 0.15s;
        }
        .url-bar:focus-within {
            border-color: var(--accent-blue, #58a6ff);
        }
        .url-bar .lock-icon {
            color: var(--accent-green, #3fb950);
            flex-shrink: 0;
            margin-right: 6px;
        }
        .url-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary, #c9d1d9);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.8rem;
            outline: none;
            min-width: 0;
        }
        .url-bar .url-reported {
            flex-shrink: 0;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid var(--card-border, #30363d);
            color: var(--text-muted, #8b949e);
            font-size: 0.68rem;
            white-space: nowrap;
        }
        .url-bar .url-reported[hidden] {
            display: none;
        }
        .url-bar input::placeholder {
            color: var(--text-muted, #484f58);
        }
        .browser-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .browser-controls .connection-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
        }
        .browser-controls .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .connection-status.connected .status-dot {
            background: var(--accent-green, #3fb950);
            box-shadow: 0 0 6px var(--accent-green, #3fb950);
        }
        .connection-status.connecting .status-dot {
            background: var(--accent-orange, #d29922);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .connection-status.disconnected .status-dot {
            background: var(--accent-red, #f85149);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Tab bar */
        .tab-bar {
            display: flex;
            align-items: flex-end;
            background: var(--bg-primary, #0d1117);
            border-bottom: 1px solid var(--card-border, #30363d);
            height: 36px;
            padding: 0 4px;
            gap: 2px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-shrink: 0;
            scrollbar-width: none;
        }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 30px;
            padding: 0 12px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-secondary, #8b949e);
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            max-width: 200px;
            min-width: 60px;
            flex-shrink: 0;
            transition: all 0.15s;
            user-select: none;
        }
        .tab:hover {
            background: var(--bg-secondary, #1c2128);
            color: var(--text-primary, #c9d1d9);
        }
        .tab.active {
            background: var(--card-bg, #161b22);
            border-color: var(--card-border, #30363d);
            color: var(--text-primary, #c9d1d9);
        }
        .tab .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .tab .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.1s, background 0.1s;
            flex-shrink: 0;
        }
        .tab:hover .tab-close, .tab.active .tab-close {
            opacity: 0.6;
        }
        .tab .tab-close:hover {
            opacity: 1;
            background: rgba(248,81,73,0.2);
            color: var(--accent-red, #f85149);
        }
        .tab-new {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-secondary, #8b949e);
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .tab-new:hover {
            background: var(--bg-secondary, #1c2128);
            color: var(--text-primary, #c9d1d9);
        }

        .frame-container {
            position: relative;
            flex: 1;
            overflow: hidden;
        }
        .frame-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .frame-container iframe.hidden-tab {
            visibility: hidden;
            pointer-events: none;
        }
        .browser-error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 16px;
            padding: 2rem;
        }
        .browser-error svg {
            width: 48px;
            height: 48px;
            color: var(--text-muted, #484f58);
        }
        .browser-error h2 {
            font-size: 1.2rem;
            color: var(--text-primary, #c9d1d9);
            margin: 0;
        }
        .browser-error p {
            color: var(--text-secondary, #8b949e);
            margin: 0;
            max-width: 400px;
        }
        /* Full-height layout */
        body {
            display: flex;
            flex-direction: column;
        }
        /* Responsive */
        @media (max-width: 600px) {
            .browser-header {
                gap: 4px;
                padding: 0 8px;
            }
            .browser-title span {
                display: none;
            }
            .browser-controls #status-text {
                display: none;
            }
            .tab { max-width: 120px; padding: 0 8px; }
        }
    </style>
</head>
<body>
    <header class="browser-header">
        <div class="browser-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
            </svg>
            <span id="service-name">{{SERVICE_NAME}}</span>
        </div>

        <div class="browser-nav">
            <button id="btn-back" onclick="goBack()" title="Back" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <button id="btn-forward" onclick="goForward()" title="Forward" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <button id="btn-refresh" onclick="refreshPage()" title="Refresh">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>

        <div class="url-bar">
            <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input type="text" id="url-input" value="{{TARGET_DISPLAY}}" placeholder="Loading..." spellcheck="false" autocomplete="off">
            <span class="url-reported" id="url-reported" hidden title="The embedded browser's address bar is a convenience, not a security indicator. The page on screen may be on another site: this address was reported by the page itself and the portal cannot confirm it. The portal marks an address it could not confirm in two cases: a page that reports an address on another site than the one the portal requested, and a page that does not answer the portal (an image, plain text, a file, or a page that stops the portal's script). A hostile page may still show a wrong address, so before entering a password check the site's identity by opening it in a real browser tab.">reported by the page, not confirmed</span>
        </div>

        <div class="browser-controls">
            <div class="connection-status connecting" id="connection-status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting</span>
            </div>
            <button class="btn btn-secondary" id="btn-external" onclick="openExternal()" title="Open in new tab" style="padding:4px 6px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                </svg>
            </button>
            <button class="btn btn-secondary" onclick="disconnect()" title="Disconnect" style="padding:4px 6px;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </header>

    <div class="tab-bar" id="tab-bar">
        <button class="tab-new" onclick="addTab()" title="New Tab (Ctrl+T)">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
        </button>
    </div>

    <div class="frame-container" id="frame-container">
        <div class="browser-error" id="browser-error">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.072 16.5c-.77.833.192 2.5 1.732 2.5z" />
            </svg>
            <h2>Connection Failed</h2>
            <p id="error-message">Could not reach the upstream service. Check that the target host is running and accessible.</p>
            <button class="btn btn-primary" onclick="reconnect()">Retry Connection</button>
        </div>
    </div>

    <script src="/static/js/portal.js?v=52"></script>
    <script>
        const connectionId = '{{CONNECTION_ID}}';
        const proxyBase = '{{PROXY_PATH}}';
        // A member who was only given this connection sees its name in the address bar instead of the
        // target (targetHidden): the label is read from the input, the script holds no address, and a
        // path that names no origin is resolved by the server against the connection.
        const targetHidden = {{TARGET_HIDDEN}};
        const targetDisplay = targetHidden ? document.getElementById('url-input').defaultValue : '{{TARGET_DISPLAY_JS}}';
        const browserMode = {{BROWSER_MODE}};
        // Optional same-origin portal page to use as the home / new-tab page
        // (e.g. "/search/" for the default Web Browser when SearXNG is enabled).
        // Empty string => fall back to the proxied connection target.
        const homeUrl = '{{HOME_URL}}';
        // Exposed for same-origin home pages loaded in the iframe (e.g. SearXNG):
        // `const` isn't a window property, so hand these out explicitly.
        window.PORTAL_EMBEDDED_BROWSER = { connectionId, proxyBase, browserMode, homeUrl };
        const urlInput = document.getElementById('url-input');
        const reportedEl = document.getElementById('url-reported');
        const externalBtn = document.getElementById('btn-external');
        const EXTERNAL_TITLE = 'Open in new tab';
        const EXTERNAL_UNCONFIRMED_TITLE = 'Not available: the page has reported that it is on another site and the portal cannot confirm which one. Enter an address to load a page the portal knows.';
        // The tag has two states. "reported": a report of the page names another site (evidence). "requested": the page
        // did not answer the portal at all (an image, text, a file, a page that does not report): the bar then shows the
        // address the portal last requested for the tab, which the page has not confirmed.
        const REPORTED_TEXT = 'reported by the page, not confirmed';
        const REPORTED_TITLE = reportedEl.title;
        const REQUESTED_TEXT = 'requested address, not confirmed by the page';
        const REQUESTED_TITLE = 'The page on screen did not answer the portal (an image, text, a file or a page that does not report), so this is the address the portal last requested for this tab, not one the page confirmed. The page on screen may be on another site. The portal marks an address it could not confirm in two cases: a page that reports an address on another site than the one the portal requested, and a page that does not answer the portal (an image, plain text, a file, or a page that stops the portal\'s script). The embedded browser\'s address bar is a convenience, not a security indicator: before entering a password, check the site\'s identity by opening it in a real browser tab.';
        // Reports from the page that was on screen before the portal started a navigation are not trusted until the
        // new page has loaded (or this long has passed: a change of the fragment alone causes no load).
        const NAV_QUIET_MS = 10000;
        // A page loaded by an address the portal gave the frame keeps that address on the bar for this long while the
        // document in the frame has not yet answered the portal's ping; after that the tab is marked like any other.
        const PING_GRACE_MS = 2000;
        const statusEl = document.getElementById('connection-status');
        const statusTextEl = document.getElementById('status-text');
        const errorEl = document.getElementById('browser-error');
        const tabBar = document.getElementById('tab-bar');
        const frameContainer = document.getElementById('frame-container');

        // Tab state
        let tabs = [];
        let activeTabId = null;
        let tabIdCounter = 0;
        let urlPollInterval = null;
        let sessionDead = false;

        function setStatus(state, text) {
            statusEl.className = 'connection-status ' + state;
            statusTextEl.textContent = text;
        }

        // A member who was only given the connection reaches its own site under /proxy/<id>/~/, a path that holds no
        // host or port (the server resolves it against the connection); another site keeps its origin in the path.
        const ownBase = (browserMode && targetHidden) ? proxyBase + '/~' : proxyBase;

        function getHomeSrc() {
            return homeUrl || (ownBase + '/');
        }

        // True when the iframe is showing the same-origin portal home page
        // (homeUrl) rather than a proxied target.
        function isPortalHomePath(path) {
            if (!homeUrl) return false;
            const base = homeUrl.replace(/\/$/, '');
            return path === base || path.startsWith(base + '/');
        }

        function proxyPathToDisplay(proxyUrl) {
            try {
                const url = new URL(proxyUrl, window.location.origin);
                const path = url.pathname;
                const prefix = proxyBase + '/';
                // Same-origin portal home page (e.g. /search/): show the real path.
                if (isPortalHomePath(path)) {
                    return path + url.search;
                }
                if (browserMode) {
                    if (path.startsWith(prefix)) {
                        const remainder = path.slice(prefix.length);
                        if (targetHidden && (remainder === '~' || remainder.startsWith('~/'))) {
                            return targetDisplay + '/' + remainder.slice(2) + url.search + url.hash;
                        }
                        if (remainder.match(/^https?:\/\//)) {
                            let display = remainder;
                            if (url.search) display += url.search;
                            if (url.hash) display += url.hash;
                            return display;
                        }
                    }
                    return targetDisplay + '/';
                }
                if (path.startsWith(prefix)) {
                    return targetDisplay + '/' + path.slice(prefix.length);
                } else if (path === proxyBase) {
                    return targetDisplay + '/';
                }
            } catch {}
            return targetDisplay + '/';
        }

        function displayToProxyPath(display) {
            if (targetHidden) {
                // The name stands for the connection's target: what follows it is a path on the target
                if (display.startsWith(targetDisplay))
                    return ownBase + '/' + display.slice(targetDisplay.length).replace(/^\/+/, '');
                if (display.startsWith('/')) return ownBase + display;
            }
            if (browserMode) {
                if (display.startsWith('http://') || display.startsWith('https://'))
                    return proxyBase + '/' + display;
                if (display.match(/^[a-zA-Z0-9][a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/))
                    return proxyBase + '/https://' + display;
                if (display.startsWith('/'))
                    return proxyBase + '/' + targetDisplay + display;
                return proxyBase + '/' + display;
            }
            if (display.startsWith(targetDisplay)) {
                return proxyBase + '/' + display.slice(targetDisplay.length).replace(/^\/+/, '');
            }
            if (display.startsWith('/')) {
                return proxyBase + display;
            }
            return proxyBase + '/' + display;
        }

        function getActiveTab() {
            return tabs.find(t => t.id === activeTabId);
        }

        function getActiveFrame() {
            const tab = getActiveTab();
            return tab ? tab.iframe : null;
        }

        // --- Tab title extraction ---
        // A framed page the portal shows in its own origin can be read from here. An isolated page (every page of
        // browser mode, and a web connection shared by a member) runs in an opaque origin: it cannot be read, so
        // its injected script posts its address and title ("portalFrame") and this keeps the last of them.
        function stripCap(path) {
            return path.replace(/^(\/proxy\/[^\/]+)\/~pc1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{24}(?=\/|$)/, '$1');
        }
        function frameTab(iframe) {
            return tabs.find(t => t.iframe === iframe) || null;
        }
        // Which site a path under proxyBase names: "https://host" in browser mode, "~" for the connection's own
        // site (a grantee's address), "" for a path on the connection's target.
        function proxyHostKey(path) {
            const rest = path.slice((proxyBase + '/').length);
            const m = rest.match(/^(https?:\/\/[^\/?#]+)/i);
            if (m) return m[1].toLowerCase();
            if (rest === '~' || rest.startsWith('~/')) return '~';
            return '';
        }
        // The address the portal itself gave the frame (its src, capability removed), or null.
        function knownFramePath(iframe) {
            try {
                const u = new URL(iframe.getAttribute('src') || '', window.location.origin);
                if (u.origin !== window.location.origin) return null;
                return stripCap(u.pathname) + u.search + u.hash;
            } catch {}
            return null;
        }
        // The address an isolated page reported, only when it is on this portal and under this connection.
        function reportedFramePath(href) {
            try {
                const u = new URL(href, window.location.origin);
                if (u.origin !== window.location.origin) return null;
                const p = stripCap(u.pathname);
                if (!p.startsWith(proxyBase + '/')) return null;
                return p + u.search + u.hash;
            } catch {}
            return null;
        }
        // Which site a frame's page reported, compared with the site the portal resolved for the tab. A report that
        // names another site sets t.unconfirmed, and nothing but a navigation the portal starts (setFrameSrc) clears
        // it again: a page that reports another site and then navigates itself, or a link to another site that
        // reports its own address, cannot make the old address look current. A report that is not under this
        // connection is never shown and counts for nothing.
        // markOnly: the report is the first one of a document the portal started (see the message handler); it may
        // only mark the tab, never set what the bar shows.
        function noteReportedSite(t, href, markOnly) {
            if (href === undefined) href = t.href;
            if (!browserMode || !href) return;
            const known = knownFramePath(t.iframe);
            if (known === null || !known.startsWith(proxyBase + '/')) return;
            const rep = reportedFramePath(href);
            if (rep === null) return;
            if (!markOnly) t.lastRep = rep;
            if (proxyHostKey(rep.split(/[?#]/)[0]) !== proxyHostKey(known.split(/[?#]/)[0])) t.unconfirmed = true;
        }
        // What the address bar may show for a frame: { path, unconfirmed, evidence }. A page the portal can read is shown
        // as it is. An isolated page cannot be read: the bar shows the address the portal gave the frame, replaced by
        // the address the page reports only while that names the same site as the portal's own address (a page of
        // the site cannot become another site by lying about its path). Once the page has reported another site
        // the tab is "unconfirmed" with evidence: the bar then shows only what the page last reported under this
        // connection (an empty bar when it reported nothing usable), marked as reported by the page and not confirmed,
        // and never the portal's own, now out of date, address. A page that has not answered the portal's ping and
        // has not reported another site is "unconfirmed" without evidence: the bar shows the address the portal last
        // requested for the tab, still marked, so that an image, plain text or a file the member opened is not left
        // with an empty bar. Nothing here is a security indicator: a page can still choose what it shows.
        function frameAddress(iframe) {
            try {
                const loc = iframe.contentWindow.location;
                return { path: stripCap(loc.pathname) + loc.search + loc.hash, unconfirmed: false, evidence: false };
            } catch {}
            const t = frameTab(iframe);
            // A page the portal did not start has not yet answered the portal's ping (see startHandshake): nothing
            // it says or does not say is known, so the tab is marked.
            // The exception is a page the portal started: while its answer is awaited (a short time) the address the
            // portal gave the frame stays, and the answer then confirms it or marks another site.
            if (browserMode && t && t.pending && !(t.pendingKnown && Date.now() - t.pendingKnown < PING_GRACE_MS)) {
                if (t.unconfirmed) return { path: t.lastRep || '', unconfirmed: true, evidence: true };
                return { path: knownFramePath(iframe) || '', unconfirmed: true, evidence: false };
            }
            if (browserMode && t && t.unconfirmed) return { path: t.lastRep || '', unconfirmed: true, evidence: true };
            const known = knownFramePath(iframe);
            const rep = (t && t.href) ? reportedFramePath(t.href) : null;
            const own = known === null ? null : { path: known, unconfirmed: false, evidence: false };
            if (rep === null) return own;
            if (!browserMode) return { path: rep, unconfirmed: false, evidence: false };
            if (known !== null && known.startsWith(proxyBase + '/') && proxyHostKey(known.split(/[?#]/)[0]) === proxyHostKey(rep.split(/[?#]/)[0])) {
                return { path: rep, unconfirmed: false, evidence: false };
            }
            return own;
        }
        function framePath(iframe) {
            // The path, query and fragment of the framed page as the proxy shows them (capability removed), or null.
            const a = frameAddress(iframe);
            return a ? a.path : null;
        }
        // The portal sets a frame's address itself: whatever the page reported before no longer counts, and the
        // address is confirmed again.
        function setFrameSrc(iframe, src) {
            const t = frameTab(iframe);
            if (t) { t.href = ''; t.lastRep = ''; t.unconfirmed = false; t.pending = ''; t.pendingKnown = 0; t.navAt = Date.now(); }
            iframe.src = src;
        }
        // A frame loaded a page the portal did not start (a link, a script of the page, back or forward). The portal
        // does not know which site it is, and a page that never reports (an image, plain text, a page the report
        // script could not be put into) must not keep the old address on the bar. So the tab stays marked until that
        // very document answers a ping the portal sends after the load (only the document now in the frame can: the
        // answer carries the ping's random id). Nothing the previous document reported counts for the new one.
        // A load the portal started (an address typed, a link the portal opened, a reload it asked for) gets the same
        // ping: the address it was given may have been answered by a redirect to another site, or the page may have
        // replaced itself before it finished loading. It keeps its address on the bar until the answer is due.
        function startHandshake(t, portalStarted) {
            const id = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
            t.pending = id;
            t.pendingKnown = portalStarted ? Date.now() : 0;
            if (!portalStarted) { t.href = ''; t.lastRep = ''; }
            try { t.iframe.contentWindow.postMessage({ type: 'portalPing', id: id }, '*'); } catch {}
            if (portalStarted) {
                setTimeout(function() { if (t.pending === id && t.id === activeTabId) updateUrlBar(); }, PING_GRACE_MS + 50);
            }
        }
        function extractTitle(iframe) {
            const own = frameTab(iframe);
            if (own && own.frameTitle) return own.frameTitle.substring(0, 40);
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                if (doc && doc.title) return doc.title.substring(0, 40);
            } catch {}
            // Fallback: extract hostname from URL
            try {
                const path = (framePath(iframe) || '').split(/[?#]/)[0];
                const prefix = proxyBase + '/';
                if (path.startsWith(prefix)) {
                    const remainder = path.slice(prefix.length);
                    const m = remainder.match(/^https?:\/\/([^/]+)/);
                    if (m) return m[1];
                }
            } catch {}
            return 'New Tab';
        }

        // --- Tab management ---
        function addTab(url) {
            const id = ++tabIdCounter;
            const iframe = document.createElement('iframe');
            iframe.className = 'hidden-tab';
            iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox';
            iframe.src = url || getHomeSrc();
            frameContainer.appendChild(iframe);

            const tab = { id, iframe, title: 'New Tab', href: '', frameTitle: '', lastRep: '', unconfirmed: false, pending: '', navAt: Date.now() };
            tabs.push(tab);

            // Listen for load events to update title + catch escaped navigation
            iframe.addEventListener('load', function() {
                const portalStarted = tab.navAt !== 0;
                tab.navAt = 0;
                // Safety net: if iframe navigated outside proxy path, redirect back through proxy
                if (browserMode) {
                    try {
                        const href = iframe.contentWindow.location.href;
                        const iframePath = iframe.contentWindow.location.pathname;
                        // The home page (a same-origin portal path like /search/) is
                        // loaded directly, not through the proxy — don't "rescue" it.
                        if (!iframePath.startsWith(proxyBase + '/') && !isPortalHomePath(iframePath)) {
                            // Navigation escaped the proxy — reconstruct target URL
                            const escaped = iframe.contentWindow.location.pathname +
                                iframe.contentWindow.location.search +
                                iframe.contentWindow.location.hash;
                            // Get the current target origin from the tab's last known good URL
                            const curSrc = iframe.src || '';
                            const prefix = proxyBase + '/';
                            let curOrigin = '';
                            const srcIdx = curSrc.indexOf(prefix);
                            if (srcIdx >= 0) {
                                const remainder = curSrc.slice(curSrc.indexOf(prefix) + prefix.length);
                                const m = remainder.match(/^(https?:\/\/[^/]+)/);
                                if (m) curOrigin = m[1];
                            }
                            if (!curOrigin && targetHidden) {
                                // No origin known here: the server resolves the path against the connection
                                setFrameSrc(iframe, ownBase + escaped);
                                return;
                            }
                            if (!curOrigin) curOrigin = 'https://' + targetDisplay.replace(/^https?:\/\//, '');
                            setFrameSrc(iframe, proxyBase + '/' + curOrigin + escaped);
                            return;
                        }
                    } catch(e) { /* cross-origin, ignore */ }
                }
                if (browserMode) { startHandshake(tab, portalStarted); if (tab.id === activeTabId) updateUrlBar(); }
                tab.title = extractTitle(iframe);
                renderTabs();
                if (tab.id === activeTabId) {
                    onActiveTabLoad();
                }
            });

            iframe.addEventListener('error', function() {
                if (tab.id === activeTabId) {
                    setStatus('disconnected', 'Error');
                    errorEl.style.display = 'flex';
                }
            });

            switchTab(id);
            renderTabs();
            return id;
        }

        function closeTab(id) {
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            if (tabs.length === 1) {
                // Last tab — navigate home instead of closing
                setFrameSrc(tabs[0].iframe, getHomeSrc());
                return;
            }
            const tab = tabs[idx];
            tab.iframe.remove();
            tabs.splice(idx, 1);

            if (activeTabId === id) {
                // Switch to adjacent tab
                const newIdx = Math.min(idx, tabs.length - 1);
                switchTab(tabs[newIdx].id);
            }
            renderTabs();
        }

        function switchTab(id) {
            activeTabId = id;
            tabs.forEach(t => {
                if (t.id === id) {
                    t.iframe.classList.remove('hidden-tab');
                } else {
                    t.iframe.classList.add('hidden-tab');
                }
            });
            errorEl.style.display = 'none';
            updateUrlBar();
            renderTabs();
        }

        function renderTabs() {
            // Remove old tab elements (keep the + button)
            const newBtn = tabBar.querySelector('.tab-new');
            tabBar.querySelectorAll('.tab').forEach(el => el.remove());

            tabs.forEach(tab => {
                const el = document.createElement('div');
                el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
                el.innerHTML = `<span class="tab-title">${escapeHtml(tab.title)}</span>` +
                    `<span class="tab-close" title="Close tab">` +
                    `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="12" height="12">` +
                    `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></span>`;

                el.addEventListener('click', (e) => {
                    if (e.target.closest('.tab-close')) {
                        e.stopPropagation();
                        closeTab(tab.id);
                    } else {
                        switchTab(tab.id);
                    }
                });

                // Middle-click to close
                el.addEventListener('mousedown', (e) => {
                    if (e.button === 1) {
                        e.preventDefault();
                        closeTab(tab.id);
                    }
                });

                tabBar.insertBefore(el, newBtn);
            });
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // --- Session expiry ------------------------------------------------
        // This is a long-lived window. If the user logs out (here or in another
        // tab) the server 401s / redirects every proxied request to /login, but
        // the already-rendered iframe stays on screen. Detect that and bounce
        // the whole window to /login so a logged-out user can't keep using it.
        function sessionEnded() {
            if (sessionDead) return;
            sessionDead = true;
            stopUrlPolling();
            tabs.forEach(t => { try { t.iframe.src = 'about:blank'; } catch (e) {} });
            window.location.replace('/login');
        }
        async function checkSession() {
            try {
                const r = await fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' });
                if (r.status === 401 || r.status === 403) sessionEnded();
            } catch (e) { /* transient network error — ignore */ }
        }
        setInterval(checkSession, 20000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) checkSession(); });
        window.addEventListener('focus', checkSession);

        // A tab frame landed on /login or on the "This page expired" page. The session has ended only when
        // GET /api/me, made from this window (it holds the cookie), answers 401/403; then the whole window goes to
        // /login. Otherwise the tab is loaded again once from this window, at the address the page was at (or its
        // last address given by this window), which mints a fresh capability. A second landing within 30 seconds
        // is left alone: no reload loop.
        const STALE_RETRY_MS = 30000;
        async function recoverStaleFrame(frame, resumePath) {
            const tab = frameTab(frame);
            if (!tab || tab.staleBusy || sessionDead) return;
            if (tab.staleAt && Date.now() - tab.staleAt < STALE_RETRY_MS) return;
            tab.staleBusy = true;
            try {
                let status = 0;
                try {
                    const r = await fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' });
                    status = r.status;
                } catch (e) { return; /* transient network error: try again at the next poll */ }
                if (status === 401 || status === 403) { sessionEnded(); return; }
                let target = resumePath;
                if (!target || !(target.startsWith(proxyBase + '/') || isPortalHomePath(target.split(/[?#]/)[0]))) {
                    target = knownFramePath(frame);
                }
                if (!target || !(target.startsWith(proxyBase + '/') || isPortalHomePath(target.split(/[?#]/)[0]))) return;
                tab.staleAt = Date.now();
                setFrameSrc(frame, target);
            } finally {
                tab.staleBusy = false;
            }
        }

        // --- URL bar + navigation ---
        function updateUrlBar() {
            const frame = getActiveFrame();
            if (!frame) return;
            try {
                const loc = frame.contentWindow.location;
                if (loc.origin === window.location.origin) {
                    // A tab frame that shows the login page, or the portal's "This page expired" page (the capability
                    // of an isolated page ran out and a link in it was clicked), does not mean the session ended: the
                    // frame makes no request with the cookie, this window does. Ask from here.
                    if (loc.pathname === '/login' && homeUrl !== '/login') {
                        recoverStaleFrame(frame, null);
                        return;
                    }
                    const d = frame.contentDocument;
                    if (loc.pathname.startsWith(proxyBase + '/') && d && d.documentElement &&
                        d.documentElement.hasAttribute('data-portal-expired')) {
                        recoverStaleFrame(frame, stripCap(loc.pathname) + loc.search);
                        return;
                    }
                }
            } catch {}
            const shown = frameAddress(frame);
            if (shown !== null) urlInput.value = shown.path ? proxyPathToDisplay(shown.path) : '';
            const unconfirmed = browserMode && shown !== null && shown.unconfirmed;
            // Open in new tab is off only while a report names another site; for a page that is merely silent it opens
            // the address the portal requested (when there is one it can open).
            const blocked = unconfirmed && (shown.evidence || requestedAddress(frame) === null);
            reportedEl.hidden = !unconfirmed;
            if (unconfirmed) {
                reportedEl.textContent = shown.evidence ? REPORTED_TEXT : REQUESTED_TEXT;
                reportedEl.title = shown.evidence ? REPORTED_TITLE : REQUESTED_TITLE;
            }
            externalBtn.disabled = blocked;
            externalBtn.title = blocked ? EXTERNAL_UNCONFIRMED_TITLE : EXTERNAL_TITLE;

            // Update tab title
            const tab = getActiveTab();
            if (tab) {
                const newTitle = extractTitle(frame);
                if (newTitle !== tab.title) {
                    tab.title = newTitle;
                    renderTabs();
                }
            }
        }

        function startUrlPolling() {
            if (urlPollInterval) clearInterval(urlPollInterval);
            urlPollInterval = setInterval(updateUrlBar, 500);
        }

        function stopUrlPolling() {
            if (urlPollInterval) {
                clearInterval(urlPollInterval);
                urlPollInterval = null;
            }
        }

        function onActiveTabLoad() {
            const frame = getActiveFrame();
            if (!frame) return;
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (doc && doc.title && doc.title.includes('Cannot reach')) {
                    setStatus('disconnected', 'Error');
                    errorEl.style.display = 'flex';
                    return;
                }
                setStatus('connected', 'Connected');
                updateUrlBar();
                startUrlPolling();

                doc.addEventListener('click', function() {
                    setTimeout(updateUrlBar, 100);
                });
                frame.contentWindow.addEventListener('popstate', function() {
                    setTimeout(updateUrlBar, 50);
                });
            } catch {
                setStatus('connected', 'Connected');
            }
        }

        // Ask an isolated (opaque-origin) page to go back, forward or reload; true when the message was sent.
        function frameCommand(frame, action) {
            try { frame.contentWindow.postMessage({ type: 'portalNav', action: action }, '*'); return true; } catch { return false; }
        }

        // Navigation
        function goBack() {
            const frame = getActiveFrame();
            if (!frame) return;
            try { frame.contentWindow.history.back(); } catch { frameCommand(frame, 'back'); }
        }

        function goForward() {
            const frame = getActiveFrame();
            if (!frame) return;
            try { frame.contentWindow.history.forward(); } catch { frameCommand(frame, 'forward'); }
        }

        function refreshPage() {
            const frame = getActiveFrame();
            if (!frame) return;
            try { frame.contentWindow.location.reload(); } catch {
                // An isolated page reloads itself on request (its address carries its capability); one that
                // does not answer is loaded again from the address this frame was given.
                if (!frameCommand(frame, 'reload')) setFrameSrc(frame, frame.src);
            }
        }

        function navigateTo(display) {
            const frame = getActiveFrame();
            if (!frame) return;
            setFrameSrc(frame, displayToProxyPath(display));
        }

        // The address the portal last requested for a frame, in a form a real browser tab can open (the real address of
        // the site, or the portal's own entry path for a member who is not told the target), or null.
        function requestedAddress(iframe) {
            const known = knownFramePath(iframe);
            if (known === null || !known.startsWith(proxyBase + '/')) return null;
            if (targetHidden) return window.location.origin + known;
            const display = proxyPathToDisplay(known);
            return /^https?:\/\//i.test(display) ? display : null;
        }

        function openExternal() {
            const own = getActiveTab();
            // A report of the page names another site: opening the address on the bar, or the address the portal gave
            // the frame, would open a site the page on screen may not be on.
            if (own && own.unconfirmed) return;
            const frame = getActiveFrame();
            const shown = frame ? frameAddress(frame) : null;
            if (browserMode && shown && shown.unconfirmed) {
                // The page did not answer: open what the portal itself requested for this tab, not what is typed in the bar.
                const addr = requestedAddress(frame);
                if (addr !== null) window.open(addr, '_blank');
                return;
            }
            if (browserMode && !targetHidden) {
                const display = urlInput.value;
                if (display.startsWith('http://') || display.startsWith('https://'))
                    window.open(display, '_blank');
                else
                    window.open('https://' + display, '_blank');
                return;
            }
            try {
                window.open(frame.contentWindow.location.href, '_blank');
            } catch {
                if (frame) window.open(frame.src, '_blank');
            }
        }

        function disconnect() {
            stopUrlPolling();
            tabs.forEach(t => t.iframe.src = 'about:blank');
            setStatus('disconnected', 'Disconnected');
            window.close();
            setTimeout(() => { window.location.href = '/dashboard'; }, 200);
        }

        function reconnect() {
            errorEl.style.display = 'none';
            const frame = getActiveFrame();
            if (frame) setFrameSrc(frame, getHomeSrc());
            setStatus('connecting', 'Connecting');
        }

        // The address a page may open in a new tab: only a path under this connection, on this portal. A dot segment
        // (plain, percent-encoded, or written with a backslash) could leave the connection once resolved: refused.
        function ownTabAddress(url) {
            if (typeof url !== 'string' || url.length > 4096) return null;
            const pathPart = url.split(/[?#]/)[0].replace(/\\/g, '/');
            let decoded = pathPart;
            try { decoded = decodeURIComponent(pathPart); } catch {}
            for (const form of [pathPart, decoded]) {
                if (form.split('/').some(seg => seg === '.' || seg === '..' || /^(%2e|\.)(%2e|\.)?$/i.test(seg))) return null;
            }
            let u;
            try { u = new URL(url, window.location.origin); } catch { return null; }
            if (u.origin !== window.location.origin) return null;
            if (!u.pathname.startsWith(proxyBase + '/')) return null;
            return u.pathname + u.search + u.hash;
        }

        // Open a URL in a new tab (called from JS interceptor via postMessage)
        // Messages come from this page's own origin (the portal pages in a frame) or from an isolated page, whose
        // origin is "null": the latter is accepted only from one of this page's own tab frames.
        window.addEventListener('message', function(e) {
            const fromFrame = tabs.find(t => t.iframe.contentWindow === e.source) || null;
            if (e.origin !== window.location.origin && !(e.origin === 'null' && fromFrame)) return;
            if (!e.data) return;
            if (e.data.type === 'openTab' && e.data.url) {
                const own = ownTabAddress(e.data.url);
                if (own === null) return;
                addTab(own);
            } else if (e.data.type === 'portalFrame' && fromFrame) {
                // The answer to the ping comes from the document now in the frame, whoever started the load.
                const answered = !!fromFrame.pending && e.data.ping === fromFrame.pending;
                if (answered) fromFrame.pending = '';
                if (typeof e.data.href === 'string' && (answered || !(fromFrame.navAt && Date.now() - fromFrame.navAt < NAV_QUIET_MS))) {
                    fromFrame.href = e.data.href.substring(0, 4096);
                    noteReportedSite(fromFrame);
                }
                // A document the portal loaded that runs the report script sends one report before any script of the
                // page. A page can silence its later answers (and forge one), but not that report, so it counts, for
                // marking another site only, although the quiet time after the portal started the load would drop it.
                else if (e.data.first === 1 && typeof e.data.href === 'string' && !answered) {
                    noteReportedSite(fromFrame, e.data.href.substring(0, 4096), true);
                }
                if (typeof e.data.title === 'string') fromFrame.frameTitle = e.data.title.substring(0, 200);
                const shown = extractTitle(fromFrame.iframe);
                if (shown !== fromFrame.title) { fromFrame.title = shown; renderTabs(); }
                if (fromFrame.id === activeTabId) {
                    updateUrlBar();
                    if (fromFrame.frameTitle.includes('Cannot reach')) {
                        setStatus('disconnected', 'Error');
                        errorEl.style.display = 'flex';
                    }
                }
            }
        });

        // URL bar keyboard nav
        urlInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                navigateTo(this.value);
                this.blur();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                updateUrlBar();
                this.blur();
            }
        });

        urlInput.addEventListener('focus', function() {
            setTimeout(() => this.select(), 0);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
            if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'r' && document.activeElement.tagName !== 'IFRAME') {
                e.preventDefault();
                refreshPage();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                e.preventDefault();
                urlInput.focus();
            }
            // Ctrl+T = new tab
            if ((e.ctrlKey || e.metaKey) && e.key === 't') {
                e.preventDefault();
                addTab();
            }
            // Ctrl+W = close tab
            if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
                e.preventDefault();
                if (activeTabId) closeTab(activeTabId);
            }
            // Ctrl+Tab / Ctrl+Shift+Tab = next/prev tab
            if ((e.ctrlKey || e.metaKey) && e.key === 'Tab') {
                e.preventDefault();
                const idx = tabs.findIndex(t => t.id === activeTabId);
                if (e.shiftKey) {
                    switchTab(tabs[(idx - 1 + tabs.length) % tabs.length].id);
                } else {
                    switchTab(tabs[(idx + 1) % tabs.length].id);
                }
            }
        });

        // Initialize with first tab
        setStatus('connecting', 'Connecting');
        if (homeUrl) urlInput.value = homeUrl;
        addTab();
    </script>
</body>
</html>
