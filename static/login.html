<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gateway - Login</title>
    <link rel="stylesheet" href="/static/css/portal.css">
    <style>
        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .form-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            cursor: pointer;
        }
        .form-footer a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none !important;
        }
        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="card">
            <div class="login-header">
                <div class="portal-brand">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
                    </svg>
                    Portal Gateway
                </div>
                <div class="login-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <h1 id="form-title">Welcome Back</h1>
                <p id="form-subtitle">Sign in to access your services</p>
            </div>

            <div id="message-container"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required autofocus autocomplete="username" placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner spinner" style="display: none;"></span>
                </button>

                <div class="form-footer">
                    Don't have an account? <a onclick="showRegister()">Register</a>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" required autocomplete="username" placeholder="Choose a username">
                </div>

                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" required autocomplete="new-password" placeholder="Choose a password">
                </div>

                <div class="form-group">
                    <label for="register-invite">Invite Code</label>
                    <input type="text" id="register-invite" name="invite_code" required placeholder="PORTAL-XXXX-XXXX-XXXX" style="text-transform: uppercase;">
                </div>

                <button type="submit" class="btn btn-primary" id="register-btn">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-spinner spinner" style="display: none;"></span>
                </button>

                <div class="form-footer">
                    Already have an account? <a onclick="showLogin()">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const messageContainer = document.getElementById('message-container');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');

        function showLogin() {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            formTitle.textContent = 'Welcome Back';
            formSubtitle.textContent = 'Sign in to access your services';
            messageContainer.innerHTML = '';
            document.getElementById('login-username').focus();
        }

        function showRegister() {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            formTitle.textContent = 'Create Account';
            formSubtitle.textContent = 'Register with an invite code';
            messageContainer.innerHTML = '';
            document.getElementById('register-username').focus();
        }

        function showError(message) {
            messageContainer.innerHTML = `<div class="error-message">${escapeHtml(message)}</div>`;
        }

        function showSuccess(message) {
            messageContainer.innerHTML = `<div class="success-message">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setButtonLoading(btn, loading, text) {
            const btnText = btn.querySelector('.btn-text');
            const btnSpinner = btn.querySelector('.btn-spinner');
            btn.disabled = loading;
            btnSpinner.style.display = loading ? 'inline-block' : 'none';
            btnText.textContent = text;
        }

        // Login form handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            setButtonLoading(btn, true, 'Signing in...');
            messageContainer.innerHTML = '';

            const data = {
                username: document.getElementById('login-username').value,
                password: document.getElementById('login-password').value
            };

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'same-origin'
                });

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const result = await response.json();
                    showError(result.error || 'Invalid credentials');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
            } finally {
                setButtonLoading(btn, false, 'Sign In');
            }
        });

        // Register form handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            setButtonLoading(btn, true, 'Creating account...');
            messageContainer.innerHTML = '';

            const data = {
                username: document.getElementById('register-username').value,
                password: document.getElementById('register-password').value,
                invite_code: document.getElementById('register-invite').value.toUpperCase()
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess('Account created successfully! You can now sign in.');
                    // Clear register form and switch to login
                    registerForm.reset();
                    setTimeout(() => {
                        showLogin();
                        document.getElementById('login-username').value = data.username;
                        document.getElementById('login-password').focus();
                    }, 1500);
                } else {
                    showError(result.error || 'Registration failed');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
            } finally {
                setButtonLoading(btn, false, 'Create Account');
            }
        });
    </script>
</body>
</html>
