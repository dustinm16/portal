<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SERVICE_NAME}} - Open Relay Portal</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=25">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }
        .media-container {
            display: flex;
            height: calc(100vh - 50px);
        }
        .stream-sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-header h3 {
            margin: 0;
            font-size: 0.875rem;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stream-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .stream-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.25rem;
        }
        .stream-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .stream-item.active {
            background: rgba(96, 165, 250, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.3);
        }
        .stream-item.offline {
            opacity: 0.5;
        }
        .stream-name {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .stream-meta {
            font-size: 0.75rem;
            color: #a1a1aa;
            display: flex;
            gap: 0.75rem;
        }
        .stream-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .stream-badge.live {
            color: #22c55e;
        }
        .stream-badge.offline {
            color: #ef4444;
        }
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        .video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #video-player {
            max-width: 100%;
            max-height: 100%;
            background: #000;
        }
        .video-placeholder {
            color: #a1a1aa;
            text-align: center;
        }
        .video-placeholder svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .video-controls {
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .control-btn {
            background: none;
            border: none;
            color: #e4e4e7;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .control-btn svg {
            width: 20px;
            height: 20px;
        }
        .stream-info {
            flex: 1;
            font-size: 0.875rem;
        }
        .stream-info .title {
            font-weight: 500;
        }
        .stream-info .status {
            font-size: 0.75rem;
            color: #a1a1aa;
        }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
        }
        .connection-status.connected {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
        }
        .connection-status.connecting {
            background: rgba(234, 179, 8, 0.1);
            color: #eab308;
        }
        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .no-streams {
            padding: 2rem;
            text-align: center;
            color: #a1a1aa;
        }
        @media (max-width: 768px) {
            .stream-sidebar {
                width: 100%;
                height: auto;
                max-height: 200px;
            }
            .media-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="media-page">
    <header class="terminal-header">
        <div class="terminal-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <span id="service-name">{{SERVICE_NAME}}</span>
        </div>
        <div class="terminal-controls">
            <div class="connection-status connecting" id="connection-status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
            <button class="btn btn-secondary" onclick="refreshStreams()" title="Refresh Streams">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <button class="btn btn-secondary" onclick="window.close()" title="Close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </header>

    <div class="media-container">
        <div class="stream-sidebar">
            <div class="sidebar-header">
                <h3>Available Streams</h3>
            </div>
            <div class="stream-list" id="stream-list">
                <div class="no-streams">Loading streams...</div>
            </div>
        </div>

        <div class="video-container">
            <div class="video-wrapper">
                <video id="video-player" autoplay playsinline muted></video>
                <div class="video-placeholder" id="video-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    <p>Select a stream to watch</p>
                </div>
            </div>
            <div class="video-controls">
                <button class="control-btn" onclick="toggleMute()" id="mute-btn" title="Unmute">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                </button>
                <button class="control-btn" onclick="toggleFullscreen()" title="Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                    </svg>
                </button>
                <div class="stream-info">
                    <div class="title" id="current-stream">No stream selected</div>
                    <div class="status" id="stream-status">-</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/portal.js"></script>
    <script>
        const serviceId = '{{SERVICE_ID}}';
        let ws = null;
        let pc = null;
        let currentStream = null;
        let streams = [];
        let resourceUrl = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            connect();
        });

        function connect() {
            updateStatus('connecting', 'Connecting...');

            const wsUrl = Portal.getWebSocketUrl(`/ws/media/${serviceId}`);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus('connected', 'Connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Invalid message:', e);
                }
            };

            ws.onclose = () => {
                updateStatus('disconnected', 'Disconnected');
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('disconnected', 'Error');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'init':
                    streams = data.streams || [];
                    renderStreams();
                    if (data.default_stream) {
                        watchStream(data.default_stream);
                    }
                    break;

                case 'streams':
                    streams = data.streams || [];
                    renderStreams();
                    break;

                case 'answer':
                    handleAnswer(data);
                    break;

                case 'error':
                    console.error('Server error:', data.message);
                    document.getElementById('stream-status').textContent = data.message;
                    break;
            }
        }

        function renderStreams() {
            const listEl = document.getElementById('stream-list');

            if (streams.length === 0) {
                listEl.innerHTML = '<div class="no-streams">No streams available</div>';
                return;
            }

            listEl.innerHTML = streams.map(stream => `
                <div class="stream-item ${stream.ready ? '' : 'offline'} ${currentStream === stream.name ? 'active' : ''}"
                     onclick="watchStream('${stream.name}')">
                    <div class="stream-name">${stream.name}</div>
                    <div class="stream-meta">
                        <span class="stream-badge ${stream.ready ? 'live' : 'offline'}">
                            <span class="status-dot"></span>
                            ${stream.ready ? 'Live' : 'Offline'}
                        </span>
                        <span>${stream.source}</span>
                        ${stream.readers > 0 ? `<span>${stream.readers} viewer${stream.readers > 1 ? 's' : ''}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function watchStream(streamName) {
            if (!streamName) return;

            const stream = streams.find(s => s.name === streamName);
            if (stream && !stream.ready) {
                alert('Stream is not available');
                return;
            }

            currentStream = streamName;
            renderStreams();

            document.getElementById('current-stream').textContent = streamName;
            document.getElementById('stream-status').textContent = 'Connecting...';
            document.getElementById('video-placeholder').style.display = 'none';
            document.getElementById('video-player').style.display = 'block';

            // Close existing connection
            if (pc) {
                pc.close();
                pc = null;
            }

            // Create new RTCPeerConnection
            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            });

            // Handle incoming tracks
            pc.ontrack = (event) => {
                const video = document.getElementById('video-player');
                video.srcObject = event.streams[0];
                document.getElementById('stream-status').textContent = 'Playing';
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate && resourceUrl) {
                    ws.send(JSON.stringify({
                        type: 'ice',
                        candidate: event.candidate.candidate,
                        resource: resourceUrl
                    }));
                }
            };

            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                if (state === 'connected') {
                    document.getElementById('stream-status').textContent = 'Playing';
                } else if (state === 'failed' || state === 'disconnected') {
                    document.getElementById('stream-status').textContent = 'Connection lost';
                }
            };

            // Add transceivers for receiving
            pc.addTransceiver('video', { direction: 'recvonly' });
            pc.addTransceiver('audio', { direction: 'recvonly' });

            // Create and send offer
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                ws.send(JSON.stringify({
                    type: 'offer',
                    stream: streamName,
                    sdp: offer.sdp
                }));
            } catch (e) {
                console.error('Failed to create offer:', e);
                document.getElementById('stream-status').textContent = 'Error: ' + e.message;
            }
        }

        async function handleAnswer(data) {
            if (!pc) return;

            resourceUrl = data.resource;

            try {
                await pc.setRemoteDescription({
                    type: 'answer',
                    sdp: data.sdp
                });
            } catch (e) {
                console.error('Failed to set remote description:', e);
            }
        }

        function refreshStreams() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'get_streams' }));
            }
        }

        function toggleMute() {
            const video = document.getElementById('video-player');
            const btn = document.getElementById('mute-btn');

            video.muted = !video.muted;

            if (video.muted) {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>`;
                btn.title = 'Unmute';
            } else {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>`;
                btn.title = 'Mute';
            }
        }

        function toggleFullscreen() {
            const video = document.getElementById('video-player');
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } else {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                }
            }
        }

        function updateStatus(status, text) {
            const statusEl = document.getElementById('connection-status');
            const statusText = document.getElementById('status-text');
            statusEl.className = `connection-status ${status}`;
            statusText.textContent = text;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (pc) pc.close();
            if (ws) ws.close(1000, 'Page closed');
        });
    </script>
</body>
</html>
