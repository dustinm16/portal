<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gateway - Chat</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=19">
    <style>
        .chat-container {
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            height: calc(100vh - 60px);
            background: var(--bg-primary);
        }

        /* Sidebar - Channels */
        .chat-sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .chat-sidebar h3 {
            padding: 1rem;
            margin: 0;
            font-size: 0.875rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.2s;
        }

        .channel-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .channel-item.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        .channel-item::before {
            content: '#';
            color: var(--text-muted);
        }

        .channel-actions {
            padding: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        /* Main Chat Area */
        .chat-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-secondary);
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-header h2::before {
            content: '#';
            color: var(--text-muted);
        }

        .chat-topic {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .message:hover {
            background: rgba(255,255,255,0.02);
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .message-username {
            font-weight: 600;
            color: var(--text-primary);
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .message-text {
            color: var(--text-secondary);
            line-height: 1.5;
            word-break: break-word;
        }

        .message-text a {
            color: var(--accent-blue);
        }

        .message.system {
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            padding: 0.25rem;
        }

        .message.system .message-text {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Input Area */
        .chat-input-container {
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-secondary);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-primary);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--accent-blue);
        }

        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            padding: 0.5rem;
            outline: none;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-send-btn {
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chat-send-btn:hover {
            background: #2563eb;
        }

        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Users Sidebar */
        .users-sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .users-sidebar h3 {
            padding: 1rem;
            margin: 0;
            font-size: 0.875rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .user-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            flex-shrink: 0;
        }

        .user-status.online { background: var(--accent-green); }
        .user-status.away { background: var(--accent-yellow); }
        .user-status.busy { background: var(--accent-red); }
        .user-status.dnd { background: #dc2626; }
        .user-status.offline { background: var(--text-muted); }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            color: var(--text-secondary);
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-nickname {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .user-status-msg {
            color: var(--text-muted);
            font-size: 0.65rem;
            font-style: italic;
        }

        /* Role badges */
        .role-badge {
            display: inline-block;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 0.25rem;
            vertical-align: middle;
        }

        .role-badge.superadmin {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
        }

        .role-badge.admin {
            background: var(--accent-red);
            color: white;
        }

        .role-badge.moderator {
            background: var(--accent-blue);
            color: white;
        }

        .role-badge.user {
            display: none; /* Don't show badge for regular users */
        }

        /* Mini badge for user list */
        .role-badge-mini {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-left: 4px;
            vertical-align: middle;
        }

        .role-badge-mini.superadmin {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            box-shadow: 0 0 4px #f59e0b;
        }

        .role-badge-mini.admin {
            background: var(--accent-red);
        }

        .role-badge-mini.moderator {
            background: var(--accent-blue);
        }

        /* @mention highlights */
        .mention {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 0 0.2rem;
            border-radius: 3px;
            cursor: pointer;
        }

        .mention:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        .mention.me {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        /* Anonymous toggle in settings */
        .anonymous-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .anonymous-toggle input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .user-count {
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0 1rem 0.5rem;
        }

        /* Connection Status */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-red);
        }

        .status-dot.connected {
            background: var(--accent-green);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .chat-container {
                grid-template-columns: 1fr;
            }
            .chat-sidebar, .users-sidebar {
                display: none;
            }
        }

        /* Typing indicator */
        .typing-indicator {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-style: italic;
            min-height: 1.5rem;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
        }
        .modal-content {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1.5rem;
            max-width: 400px;
            width: 90%;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .modal-header h3 {
            margin: 0;
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Status picker */
        .status-picker {
            position: relative;
        }

        .status-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            width: 100%;
        }

        .status-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .status-dropdown {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            margin-bottom: 0.25rem;
            overflow: hidden;
            z-index: 100;
        }

        .status-dropdown.show {
            display: block;
        }

        .status-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .status-option:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Markdown styles in messages */
        .message-text strong { font-weight: 600; }
        .message-text em { font-style: italic; }
        .message-text code {
            background: rgba(255,255,255,0.1);
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.875em;
        }
        .message-text pre {
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 0.25rem 0;
        }
        .message-text pre code {
            background: none;
            padding: 0;
        }
        .message-text del {
            text-decoration: line-through;
            opacity: 0.7;
        }
        .message-text blockquote {
            border-left: 3px solid var(--accent-blue);
            padding-left: 0.75rem;
            margin: 0.25rem 0;
            color: var(--text-muted);
        }

        /* Emoji picker */
        .emoji-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            font-size: 1.25rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .emoji-btn:hover {
            opacity: 1;
        }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            max-width: 300px;
            z-index: 100;
        }

        .emoji-picker.show {
            display: block;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.25rem;
        }

        .emoji-item {
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1.25rem;
            text-align: center;
            border-radius: 4px;
        }

        .emoji-item:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Input area adjustments */
        .chat-input-wrapper {
            position: relative;
        }

        /* User settings section */
        .user-settings {
            padding: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .nickname-input {
            width: 100%;
            padding: 0.25rem 0.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .nickname-input::placeholder {
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/dashboard" style="display: flex; align-items: center; gap: 0.5rem; color: inherit; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
                </svg>
                Portal Gateway
            </a>
        </div>
        <div class="navbar-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/chat" class="active">Chat</a>
            <a href="/docs">API Docs</a>
            <span id="username-display" style="color: var(--text-muted);"></span>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="chat-container">
        <!-- Channels Sidebar -->
        <aside class="chat-sidebar">
            <h3>Channels</h3>
            <div class="channel-list" id="channel-list">
                <!-- Channels populated by JS -->
            </div>
            <div class="channel-actions">
                <button class="btn btn-secondary btn-sm" onclick="showCreateChannelModal()" style="width: 100%;">
                    + New Channel
                </button>
            </div>
            <div class="user-settings">
                <div class="status-picker">
                    <button class="status-btn" onclick="toggleStatusDropdown()">
                        <span class="user-status online" id="my-status-dot"></span>
                        <span id="my-status-text">Online</span>
                    </button>
                    <div class="status-dropdown" id="status-dropdown">
                        <div class="status-option" onclick="setMyStatus('online')">
                            <span class="user-status online"></span> Online
                        </div>
                        <div class="status-option" onclick="setMyStatus('away')">
                            <span class="user-status away"></span> Away
                        </div>
                        <div class="status-option" onclick="setMyStatus('busy')">
                            <span class="user-status busy"></span> Busy
                        </div>
                        <div class="status-option" onclick="setMyStatus('dnd')">
                            <span class="user-status dnd"></span> Do Not Disturb
                        </div>
                        <div class="status-option" onclick="setMyStatus('offline')">
                            <span class="user-status offline"></span> Appear Offline
                        </div>
                    </div>
                </div>
                <input type="text" class="nickname-input" id="nickname-input" placeholder="Set nickname..." maxlength="32" onchange="updateNickname()">
                <label class="anonymous-toggle">
                    <input type="checkbox" id="anonymous-toggle" onchange="toggleAnonymous()">
                    <span>Hide my username</span>
                </label>
            </div>
            <div class="connection-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="connection-text">Connecting...</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-header">
                <h2 id="channel-name">general</h2>
                <div class="chat-topic" id="channel-topic">General discussion</div>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Messages populated by JS -->
            </div>
            <div class="typing-indicator" id="typing-indicator"></div>
            <div class="chat-input-container">
                <div class="chat-input-wrapper">
                    <button class="emoji-btn" onclick="toggleEmojiPicker()" title="Insert emoji">😊</button>
                    <div class="emoji-picker" id="emoji-picker">
                        <div class="emoji-grid" id="emoji-grid"></div>
                    </div>
                    <input type="text" id="chat-input" placeholder="Type a message... (supports **bold**, *italic*, `code`, ~~strike~~)" autocomplete="off">
                    <button class="chat-send-btn" id="send-btn" onclick="sendMessage()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                        Send
                    </button>
                </div>
            </div>
        </main>

        <!-- Users Sidebar -->
        <aside class="users-sidebar">
            <h3>Online Users</h3>
            <div class="user-count" id="user-count">0 online</div>
            <div class="user-list" id="user-list">
                <!-- Users populated by JS -->
            </div>
        </aside>
    </div>

    <!-- Create Channel Modal -->
    <div id="create-channel-modal" class="modal">
        <div class="modal-backdrop" onclick="closeModal('create-channel-modal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Channel</h3>
                <button class="modal-close" onclick="closeModal('create-channel-modal')">&times;</button>
            </div>
            <form onsubmit="createChannel(event)">
                <div class="form-group">
                    <label for="channel-name-input">Channel Name</label>
                    <input type="text" id="channel-name-input" required pattern="[a-z0-9-]+" placeholder="my-channel">
                    <small style="color: var(--text-muted);">Lowercase letters, numbers, and hyphens only</small>
                </div>
                <div class="form-group">
                    <label for="channel-description">Description (optional)</label>
                    <input type="text" id="channel-description" placeholder="What's this channel about?">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('create-channel-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create Channel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let ws = null;
        let currentChannel = 'general';
        let currentUser = null;
        let reconnectAttempts = 0;
        let typingTimeout = null;
        let onlineUsers = new Map(); // user_id -> user info

        // Common emoji for quick picker
        const COMMON_EMOJI = [
            '😊', '😂', '🤣', '❤️', '😍', '🤔', '😎', '🙏',
            '👍', '👎', '👋', '🎉', '🔥', '✅', '❌', '⭐',
            '💯', '🚀', '💪', '😢', '😡', '🤷', '👀', '💡',
            '⚠️', '🐛', '🔧', '📝', '🔒', '🔓', '📌', '💬'
        ];

        // Emoji shortcodes mapping
        const EMOJI_SHORTCODES = {
            ':)': '😊', ':-)': '😊', ':D': '😃', ':-D': '😃',
            ':(': '😢', ':-(': '😢', ';)': '😉', ';-)': '😉',
            ':P': '😛', ':-P': '😛', ':O': '😮', ':-O': '😮',
            '<3': '❤️', ':heart:': '❤️', ':fire:': '🔥',
            ':+1:': '👍', ':thumbsup:': '👍', ':-1:': '👎', ':thumbsdown:': '👎',
            ':star:': '⭐', ':check:': '✅', ':x:': '❌',
            ':rocket:': '🚀', ':100:': '💯', ':clap:': '👏',
            ':eyes:': '👀', ':thinking:': '🤔', ':bulb:': '💡',
            ':warning:': '⚠️', ':bug:': '🐛', ':wrench:': '🔧',
            ':memo:': '📝', ':lock:': '🔒', ':unlock:': '🔓',
            ':wave:': '👋', ':party:': '🎉', ':tada:': '🎉',
            ':lol:': '🤣', ':cry:': '😢', ':angry:': '😡',
            ':cool:': '😎', ':pray:': '🙏', ':muscle:': '💪',
            ':shrug:': '🤷', ':pin:': '📌', ':speech:': '💬'
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserInfo();
            await loadChannels();
            connectWebSocket();

            // Enter key to send
            document.getElementById('chat-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Typing indicator
            document.getElementById('chat-input').addEventListener('input', () => {
                sendTyping();
            });
        });

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/me', { credentials: 'include' });
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                currentUser = await response.json();
                document.getElementById('username-display').textContent = currentUser.nickname || currentUser.username;

                // Set initial status display
                updateMyStatusDisplay(currentUser.status || 'online');

                // Set nickname input
                if (currentUser.nickname) {
                    document.getElementById('nickname-input').value = currentUser.nickname;
                }

                // Set anonymous toggle
                document.getElementById('anonymous-toggle').checked = currentUser.chat_anonymous || false;

                // Initialize emoji picker
                initEmojiPicker();
            } catch (error) {
                console.error('Failed to load user:', error);
            }
        }

        function getRoleBadge(role) {
            if (!role || role === 'user') return '';
            const labels = {
                'superadmin': 'Owner',
                'admin': 'Admin',
                'moderator': 'Mod'
            };
            return `<span class="role-badge ${role}">${labels[role] || role}</span>`;
        }

        function getRoleBadgeMini(role) {
            if (!role || role === 'user') return '';
            return `<span class="role-badge-mini ${role}" title="${role}"></span>`;
        }

        function initEmojiPicker() {
            const grid = document.getElementById('emoji-grid');
            grid.innerHTML = COMMON_EMOJI.map(emoji =>
                `<span class="emoji-item" onclick="insertEmoji('${emoji}')">${emoji}</span>`
            ).join('');
        }

        async function loadChannels() {
            try {
                const response = await fetch('/api/chat/channels', { credentials: 'include' });
                const data = await response.json();
                renderChannels(data.channels || []);
            } catch (error) {
                console.error('Failed to load channels:', error);
            }
        }

        function renderChannels(channels) {
            const list = document.getElementById('channel-list');
            list.innerHTML = channels.map(ch => `
                <div class="channel-item ${ch.name === currentChannel ? 'active' : ''}"
                     onclick="switchChannel('${ch.name}')" data-channel="${ch.name}">
                    ${escapeHtml(ch.name)}
                </div>
            `).join('');
        }

        function switchChannel(channelName) {
            currentChannel = channelName;

            // Update UI
            document.querySelectorAll('.channel-item').forEach(el => {
                el.classList.toggle('active', el.dataset.channel === channelName);
            });

            // Clear messages
            document.getElementById('chat-messages').innerHTML = '';

            // Request channel info and history
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'join',
                    channel: channelName
                }));
            }
        }

        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/chat`);

            ws.onopen = () => {
                console.log('Chat connected');
                updateConnectionStatus(true);
                reconnectAttempts = 0;

                // Join current channel
                ws.send(JSON.stringify({
                    type: 'join',
                    channel: currentChannel
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                console.log('Chat disconnected');
                updateConnectionStatus(false);

                // Reconnect with exponential backoff
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                reconnectAttempts++;
                setTimeout(connectWebSocket, delay);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'message':
                    appendMessage(data);
                    break;
                case 'history':
                    renderHistory(data.messages);
                    break;
                case 'channel_info':
                    updateChannelInfo(data);
                    break;
                case 'users':
                    updateUserList(data.users);
                    break;
                case 'user_joined':
                    appendSystemMessage(`${data.username} joined the channel`);
                    // Refresh user list will happen via WebSocket
                    break;
                case 'user_left':
                    onlineUsers.delete(data.user_id || data.username);
                    appendSystemMessage(`${data.username} left the channel`);
                    updateUserCount();
                    renderUserList();
                    break;
                case 'user_status_changed':
                    if (onlineUsers.has(data.user_id)) {
                        const user = onlineUsers.get(data.user_id);
                        user.status = data.status;
                        user.status_message = data.status_message;
                        renderUserList();
                    }
                    break;
                case 'user_nickname_changed':
                    if (onlineUsers.has(data.user_id)) {
                        const user = onlineUsers.get(data.user_id);
                        user.nickname = data.nickname;
                        renderUserList();
                    }
                    break;
                case 'user_anonymous_changed':
                    if (onlineUsers.has(data.user_id)) {
                        const user = onlineUsers.get(data.user_id);
                        user.username = data.username;
                        user.anonymous = data.anonymous;
                        renderUserList();
                    }
                    break;
                case 'typing':
                    showTypingIndicator(data.username);
                    break;
                case 'error':
                    alert(data.message);
                    break;
            }
        }

        function renderHistory(messages) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            messages.forEach(msg => appendMessage(msg, false));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(data, scroll = true) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.dataset.messageId = data.id;

            // Look up user info for nickname display
            const userInfo = data.user_id ? onlineUsers.get(data.user_id) : null;
            // Priority: use nickname from userInfo if available, then from data, then username
            const displayName = userInfo?.nickname || data.nickname || data.username;
            const role = data.role || userInfo?.role || 'user';
            const isAnonymous = data.anonymous || userInfo?.anonymous;
            const initial = isAnonymous ? '?' : (displayName || 'U')[0].toUpperCase();
            const time = formatTime(data.created_at || new Date().toISOString());

            // Show @username only if there's a nickname and not anonymous
            const showRealUsername = (userInfo?.nickname || data.nickname) && !isAnonymous;

            div.innerHTML = `
                <div class="message-avatar" style="${isAnonymous ? 'background: var(--text-muted);' : ''}">${initial}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-username">${escapeHtml(displayName)}</span>
                        ${getRoleBadge(role)}
                        ${showRealUsername ? `<span class="message-realname" style="color: var(--text-muted); font-size: 0.75rem;">@${escapeHtml(data.username)}</span>` : ''}
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">${formatMessage(data.message)}</div>
                </div>
            `;

            container.appendChild(div);
            if (scroll) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `<div class="message-text">${escapeHtml(text)}</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function updateChannelInfo(data) {
            document.getElementById('channel-name').textContent = data.name;
            document.getElementById('channel-topic').textContent = data.topic || data.description || 'No topic set';
        }

        function updateUserList(users) {
            // users is now an array of {user_id, username, nickname, status, status_message}
            onlineUsers = new Map();
            users.forEach(u => onlineUsers.set(u.user_id, u));
            renderUserList();
        }

        function renderUserList() {
            const list = document.getElementById('user-list');
            const users = Array.from(onlineUsers.values());

            // Sort: by role first (higher roles at top), then status, then by name
            const roleOrder = {'superadmin': 0, 'admin': 1, 'moderator': 2, 'user': 3};
            users.sort((a, b) => {
                const aRole = roleOrder[a.role] ?? 3;
                const bRole = roleOrder[b.role] ?? 3;
                if (aRole !== bRole) return aRole - bRole;
                const statusOrder = {'online': 0, 'away': 1, 'busy': 2, 'dnd': 3, 'offline': 4};
                const aOrder = statusOrder[a.status] || 0;
                const bOrder = statusOrder[b.status] || 0;
                if (aOrder !== bOrder) return aOrder - bOrder;
                return (a.nickname || a.username).localeCompare(b.nickname || b.username);
            });

            // Primary display: nickname if exists, otherwise username (unless anonymous)
            list.innerHTML = users.map(user => {
                const displayName = user.nickname || user.username;
                const showUsername = user.nickname && !user.anonymous;
                return `
                <div class="user-item" title="${user.status_message ? escapeHtml(user.status_message) : getStatusLabel(user.status)}"
                     onclick="insertMention('${escapeHtml(user.nickname || user.username)}')" style="cursor: pointer;">
                    <span class="user-status ${user.status || 'online'}"></span>
                    <div class="user-info">
                        <div class="user-name">
                            ${escapeHtml(displayName)}${getRoleBadgeMini(user.role)}
                        </div>
                        ${showUsername ? `<div class="user-nickname">@${escapeHtml(user.username)}</div>` : ''}
                        ${user.status_message ? `<div class="user-status-msg">${escapeHtml(user.status_message)}</div>` : ''}
                    </div>
                </div>
            `}).join('');
            updateUserCount();
        }

        function insertMention(name) {
            const input = document.getElementById('chat-input');
            const start = input.selectionStart;
            const text = input.value;
            const mention = `@${name} `;
            input.value = text.substring(0, start) + mention + text.substring(start);
            input.focus();
            input.setSelectionRange(start + mention.length, start + mention.length);
        }

        function getStatusLabel(status) {
            const labels = {
                'online': 'Online',
                'away': 'Away',
                'busy': 'Busy',
                'dnd': 'Do Not Disturb',
                'offline': 'Offline'
            };
            return labels[status] || 'Online';
        }

        function updateUserCount() {
            const total = onlineUsers.size;
            const online = Array.from(onlineUsers.values()).filter(u => u.status !== 'offline').length;
            document.getElementById('user-count').textContent = `${online} online`;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'message',
                channel: currentChannel,
                message: message
            }));

            input.value = '';
        }

        function sendTyping() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            if (typingTimeout) clearTimeout(typingTimeout);

            ws.send(JSON.stringify({
                type: 'typing',
                channel: currentChannel
            }));

            typingTimeout = setTimeout(() => {
                typingTimeout = null;
            }, 3000);
        }

        function showTypingIndicator(username) {
            if (username === currentUser?.username) return;

            const indicator = document.getElementById('typing-indicator');
            indicator.textContent = `${username} is typing...`;

            setTimeout(() => {
                indicator.textContent = '';
            }, 3000);
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('connection-text');

            if (connected) {
                dot.classList.add('connected');
                text.textContent = 'Connected';
            } else {
                dot.classList.remove('connected');
                text.textContent = 'Reconnecting...';
            }

            document.getElementById('send-btn').disabled = !connected;
        }

        function showCreateChannelModal() {
            document.getElementById('create-channel-modal').style.display = 'flex';
            document.getElementById('channel-name-input').focus();
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function createChannel(event) {
            event.preventDefault();

            const name = document.getElementById('channel-name-input').value.trim().toLowerCase();
            const description = document.getElementById('channel-description').value.trim();

            try {
                const response = await fetch('/api/chat/channels', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to create channel');
                }

                closeModal('create-channel-modal');
                document.getElementById('channel-name-input').value = '';
                document.getElementById('channel-description').value = '';

                await loadChannels();
                switchChannel(name);
            } catch (error) {
                alert(error.message);
            }
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            const now = new Date();
            const isToday = date.toDateString() === now.toDateString();

            if (isToday) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
                       date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
        }

        function formatMessage(text) {
            // Escape HTML first
            text = escapeHtml(text);

            // Convert emoji shortcodes
            for (const [code, emoji] of Object.entries(EMOJI_SHORTCODES)) {
                // Escape regex special characters in code
                const escaped = code.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                text = text.replace(new RegExp(escaped, 'g'), emoji);
            }

            // Code blocks (```) - must be before inline code
            text = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');

            // Inline code (`)
            text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');

            // Bold (**text** or __text__)
            text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');

            // Italic (*text* or _text_)
            text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
            text = text.replace(/_([^_\n]+)_/g, '<em>$1</em>');

            // Strikethrough (~~text~~)
            text = text.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

            // Blockquote (> text)
            text = text.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

            // @mentions - highlight usernames/nicknames
            text = text.replace(/@([\w\s\-]+?)(?=\s|$|[.,!?])/g, (match, name) => {
                const trimmedName = name.trim();
                // Check if this mention matches current user
                const isMe = currentUser && (
                    trimmedName.toLowerCase() === currentUser.username?.toLowerCase() ||
                    trimmedName.toLowerCase() === currentUser.nickname?.toLowerCase()
                );
                return `<span class="mention${isMe ? ' me' : ''}" data-mention="${escapeHtml(trimmedName)}">@${escapeHtml(trimmedName)}</span>`;
            });

            // Convert URLs to links (after markdown so we don't break URLs)
            text = text.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

            // Convert newlines to br (except in pre tags)
            text = text.replace(/\n/g, '<br>');

            return text;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Status picker functions
        function toggleStatusDropdown() {
            document.getElementById('status-dropdown').classList.toggle('show');
        }

        async function setMyStatus(status) {
            document.getElementById('status-dropdown').classList.remove('show');

            try {
                const response = await fetch('/api/me/status', {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    updateMyStatusDisplay(status);
                    if (currentUser) currentUser.status = status;
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update status');
                }
            } catch (error) {
                console.error('Failed to update status:', error);
            }
        }

        function updateMyStatusDisplay(status) {
            const dot = document.getElementById('my-status-dot');
            const text = document.getElementById('my-status-text');

            dot.className = 'user-status ' + status;
            text.textContent = getStatusLabel(status);
        }

        // Nickname function
        async function updateNickname() {
            const input = document.getElementById('nickname-input');
            const nickname = input.value.trim();

            try {
                const response = await fetch('/api/me/nickname', {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname })
                });

                if (response.ok) {
                    if (currentUser) currentUser.nickname = nickname || null;
                    document.getElementById('username-display').textContent = nickname || currentUser?.username || 'User';
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update nickname');
                    input.value = currentUser?.nickname || '';
                }
            } catch (error) {
                console.error('Failed to update nickname:', error);
            }
        }

        // Anonymous toggle
        async function toggleAnonymous() {
            const checkbox = document.getElementById('anonymous-toggle');
            const anonymous = checkbox.checked;

            try {
                const response = await fetch('/api/me/anonymous', {
                    method: 'PUT',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ anonymous })
                });

                if (response.ok) {
                    if (currentUser) currentUser.chat_anonymous = anonymous;
                    // Note: Full effect requires rejoining the chat
                    if (anonymous) {
                        appendSystemMessage('Your username is now hidden. Others will see you as "Anonymous".');
                    } else {
                        appendSystemMessage('Your username is now visible to others.');
                    }
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update anonymous setting');
                    checkbox.checked = !anonymous;
                }
            } catch (error) {
                console.error('Failed to update anonymous setting:', error);
                checkbox.checked = !anonymous;
            }
        }

        // Emoji picker functions
        function toggleEmojiPicker() {
            document.getElementById('emoji-picker').classList.toggle('show');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('chat-input');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.substring(0, start) + emoji + text.substring(end);
            input.focus();
            input.setSelectionRange(start + emoji.length, start + emoji.length);
            document.getElementById('emoji-picker').classList.remove('show');
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.status-picker')) {
                document.getElementById('status-dropdown').classList.remove('show');
            }
            if (!e.target.closest('.emoji-btn') && !e.target.closest('.emoji-picker')) {
                document.getElementById('emoji-picker').classList.remove('show');
            }
        });
    </script>
</body>
</html>
