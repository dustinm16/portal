<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Open Relay Portal - File Manager</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=41">
    <style>
        .fm-toolbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
        }
        .fm-toolbar button, .fm-toolbar select {
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
        }
        .fm-toolbar button:hover { background: rgba(255,255,255,0.1); }
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-wrap: wrap;
            flex: 1;
            min-width: 200px;
            padding: 0.4rem 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 0.85rem;
            overflow-x: auto;
        }
        .breadcrumb a {
            color: var(--accent-blue);
            text-decoration: none;
            white-space: nowrap;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { color: var(--text-muted); }
        .file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        .file-table th, .file-table td {
            padding: 0.5rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }
        .file-table th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: sticky;
            top: 0;
            background: var(--card-bg);
            z-index: 1;
        }
        .file-table tr:hover { background: rgba(255,255,255,0.05); cursor: pointer; transition: background 0.15s ease; }
        .file-table .file-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .file-icon { font-size: 1.1rem; width: 24px; text-align: center; }
        .table-scroll {
            overflow-x: auto;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            cursor: pointer;
        }
        .btn-sm:hover { background: rgba(255,255,255,0.1); }
        .btn-danger { border-color: #ef4444; color: #ef4444; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.15); }
        .edit-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .edit-modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 90%;
            max-width: 1000px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .edit-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }
        .edit-modal-header h3 { margin: 0; font-size: 1rem; }
        .edit-modal-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .edit-modal-body textarea {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            padding: 1rem 1.5rem;
            resize: none;
            tab-size: 4;
        }
        .edit-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-top: 1px solid var(--card-border);
        }
        .upload-zone {
            border: 2px dashed var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .upload-zone.dragover {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.05);
            color: var(--accent-blue);
        }
        .upload-zone input[type="file"] { display: none; }
        .sftp-conn-select {
            padding: 0.4rem 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            min-width: 200px;
        }
        .conn-status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .conn-status.connected { color: #10b981; }
        .conn-status.error { color: #ef4444; }
        .commander-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
        }
        .commander-panel .file-table { font-size: 0.8rem; }
        .commander-panel .file-table th,
        .commander-panel .file-table td { padding: 0.35rem 0.5rem; }
    </style>
</head>
<body>

    <div class="dashboard">
        <main class="main-content" style="max-width: 1400px; margin: 0 auto;">
            <div class="tab-nav">
                <button class="tab-btn active" id="tab-btn-sftp" onclick="showTab('sftp')">Remote Files (SFTP)</button>
            </div>

            <!-- SFTP Tab -->
            <div id="tab-sftp" class="tab-content">
                <div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem; align-items: center;">
                    <button class="btn-sm" id="toggle-split" onclick="toggleSplitView()" style="display: none;">Split View</button>
                    <span id="sftp-conn-count" style="font-size: 0.8rem; color: var(--text-muted);"></span>
                </div>

                <!-- Single Pane Mode -->
                <div id="sftp-single-pane">
                    <div class="fm-toolbar">
                        <select class="sftp-conn-select" id="sftp-conn-select" onchange="onPanelConnChange('single')">
                            <option value="">-- Select Connection --</option>
                        </select>
                        <span class="conn-status" id="sftp-status-single"></span>
                        <div class="breadcrumb" id="sftp-breadcrumb-single" style="flex:1;"></div>
                        <button onclick="panelNewFolder('single')">New Folder</button>
                        <button onclick="document.getElementById('sftp-upload-single').click()">Upload</button>
                        <button onclick="refreshPanel('single')">Refresh</button>
                        <input type="file" id="sftp-upload-single" multiple onchange="panelUploadFiles('single', this.files)" style="display:none;">
                    </div>
                    <div class="table-scroll">
                        <table class="file-table">
                            <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th>Permissions</th><th>Actions</th></tr></thead>
                            <tbody id="sftp-file-body-single"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Dual Pane Commander Mode -->
                <div id="sftp-dual-pane" style="display: none;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; height: calc(100vh - 260px);">
                        <div class="commander-panel">
                            <div class="fm-toolbar" style="padding: 0.5rem;">
                                <select class="sftp-conn-select" id="sftp-conn-left" onchange="onPanelConnChange('left')" style="min-width:140px;"></select>
                                <span class="conn-status" id="sftp-status-left"></span>
                                <div class="breadcrumb" id="sftp-breadcrumb-left" style="flex:1;font-size:0.8rem;"></div>
                                <button onclick="panelNewFolder('left')" style="font-size:0.75rem;padding:0.25rem 0.5rem;">New</button>
                                <button onclick="document.getElementById('sftp-upload-left').click()" style="font-size:0.75rem;padding:0.25rem 0.5rem;">Upload</button>
                                <button onclick="refreshPanel('left')" style="font-size:0.75rem;padding:0.25rem 0.5rem;">Refresh</button>
                                <input type="file" id="sftp-upload-left" multiple onchange="panelUploadFiles('left', this.files)" style="display:none;">
                            </div>
                            <div class="table-scroll" style="flex:1;overflow-y:auto;">
                                <table class="file-table">
                                    <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th>Actions</th></tr></thead>
                                    <tbody id="sftp-file-body-left"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="commander-panel">
                            <div class="fm-toolbar" style="padding: 0.5rem;">
                                <select class="sftp-conn-select" id="sftp-conn-right" onchange="onPanelConnChange('right')" style="min-width:140px;"></select>
                                <span class="conn-status" id="sftp-status-right"></span>
                                <div class="breadcrumb" id="sftp-breadcrumb-right" style="flex:1;font-size:0.8rem;"></div>
                                <button onclick="panelNewFolder('right')" style="font-size:0.75rem;padding:0.25rem 0.5rem;">New</button>
                                <button onclick="document.getElementById('sftp-upload-right').click()" style="font-size:0.75rem;padding:0.25rem 0.5rem;">Upload</button>
                                <button onclick="refreshPanel('right')" style="font-size:0.75rem;padding:0.25rem 0.5rem;">Refresh</button>
                                <input type="file" id="sftp-upload-right" multiple onchange="panelUploadFiles('right', this.files)" style="display:none;">
                            </div>
                            <div class="table-scroll" style="flex:1;overflow-y:auto;">
                                <table class="file-table">
                                    <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th>Actions</th></tr></thead>
                                    <tbody id="sftp-file-body-right"></tbody>

    <!-- Edit Modal -->
    <div id="edit-modal" class="edit-modal" style="display:none;" onclick="if(event.target===this)closeEditModal()">

            </div>

    <script src="/static/js/portal.js?v=33"></script>
    <script>
        let isAdmin = false;
        let editingFile = null;  // { path, connId, panel }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            const tabEl = document.getElementById('tab-' + tab);
            const btnEl = document.getElementById('tab-btn-' + tab);
            if (tabEl) tabEl.classList.add('active');
            if (btnEl) btnEl.classList.add('active');

            if (tab === 'sftp') loadSftpConnections();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '-';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(ts) {
            if (!ts) return '-';
            return new Date(ts * 1000).toLocaleString();
        }

        function fileIcon(type) {
            if (type === 'directory') return '<span class="file-icon" style="color:#f59e0b;">&#128193;</span>';
            if (type === 'symlink') return '<span class="file-icon" style="color:#8b5cf6;">&#128279;</span>';
            return '<span class="file-icon" style="color:#9ca3af;">&#128196;</span>';
        }

        function joinPath(base, name) {
            if (base === '/') return '/' + name;
            return base.replace(/\/+$/, '') + '/' + name;
        }

        function buildBreadcrumb(path, containerId, clickFn) {
            const el = document.getElementById(containerId);
            const parts = path.split('/').filter(Boolean);
            let html = `<a href="#" onclick="${clickFn}('/'); return false;">/</a>`;
            let cumulative = '';
            for (const part of parts) {
                cumulative += '/' + part;
                const p = cumulative;
                html += `<span>/</span><a href="#" onclick="${clickFn}('${p}'); return false;">${escapeHtml(part)}</a>`;
            }
            el.innerHTML = html;
        }

        function showToast(msg, type) {
            if (window.Portal && Portal.toast) Portal.toast(msg, type);
            else if (window.showNotification) window.showNotification(msg, type);
        }

        // ===== SFTP FILES (Panel-based) =====

        const panels = {
            single: { connId: null, path: '/', tbody: 'sftp-file-body-single', breadcrumb: 'sftp-breadcrumb-single', status: 'sftp-status-single', select: 'sftp-conn-select', upload: 'sftp-upload-single' },
            left:   { connId: null, path: '/', tbody: 'sftp-file-body-left', breadcrumb: 'sftp-breadcrumb-left', status: 'sftp-status-left', select: 'sftp-conn-left', upload: 'sftp-upload-left' },
            right:  { connId: null, path: '/', tbody: 'sftp-file-body-right', breadcrumb: 'sftp-breadcrumb-right', status: 'sftp-status-right', select: 'sftp-conn-right', upload: 'sftp-upload-right' }
        };
        let splitMode = false;
        let sftpConnectionList = [];

        function isVodConn(connId) { return connId && connId.startsWith('vod:'); }

        function sftpApiBase(connId) {
            if (isVodConn(connId)) return '/api/sftp/vod';
            return `/api/sftp/${connId}`;
        }

        async function loadSftpConnections() {
            try {
                const [connRes, vodRes] = await Promise.all([
                    fetch('/api/connections', { credentials: 'include' }),
                    fetch('/api/vods/storage', { credentials: 'include' }).catch(() => null)
                ]);
                if (connRes.status === 401) { window.location.href = '/login'; return; }
                const connData = await connRes.json();
                const conns = connData.connections || connData;
                const eligible = conns.filter(c => c.type === 'ssh' || c.type === 'sftp');

                sftpConnectionList = [];
                for (const c of eligible) {
                    sftpConnectionList.push({ id: String(c.id), label: `${c.name} (${c.host}:${c.port || 22})` });
                }

                // Add VOD storage if configured
                if (vodRes && vodRes.ok) {
                    try {
                        const vodData = await vodRes.json();
                        if (vodData.storage && vodData.storage.host) {
                            const s = vodData.storage;
                            sftpConnectionList.push({ id: 'vod:storage', label: `VOD Storage (${s.host}:${s.port || 22})` });
                        }
                    } catch (e) {}
                }

                populatePanelSelect('single');
                populatePanelSelect('left');
                populatePanelSelect('right');

                // Show split toggle if 2+ connections
                const toggleBtn = document.getElementById('toggle-split');
                const countSpan = document.getElementById('sftp-conn-count');
                if (sftpConnectionList.length >= 2) {
                    toggleBtn.style.display = '';
                    countSpan.textContent = `${sftpConnectionList.length} connections available`;
                } else {
                    toggleBtn.style.display = 'none';
                    countSpan.textContent = sftpConnectionList.length === 1 ? '1 connection' : '';
                }

                if (sftpConnectionList.length === 0) {
                    document.getElementById('sftp-file-body-single').innerHTML =
                        '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:2rem;">No SSH/SFTP connections configured. Add one in Dashboard &gt; My Connections.</td></tr>';
                }
            } catch (e) {
                console.error('Failed to load connections:', e);
            }
        }

        function populatePanelSelect(panel) {
            const sel = document.getElementById(panels[panel].select);
            if (!sel) return;
            const current = panels[panel].connId;
            sel.innerHTML = '<option value="">-- Select Connection --</option>';
            for (const c of sftpConnectionList) {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.label;
                if (c.id === current) opt.selected = true;
                sel.appendChild(opt);
            }
        }

        function toggleSplitView() {
            splitMode = !splitMode;
            document.getElementById('toggle-split').textContent = splitMode ? 'Single View' : 'Split View';
            document.getElementById('sftp-single-pane').style.display = splitMode ? 'none' : '';
            document.getElementById('sftp-dual-pane').style.display = splitMode ? '' : 'none';

            if (splitMode) {
                // Auto-assign connections to panels
                if (!panels.left.connId && sftpConnectionList.length >= 1) {
                    panels.left.connId = sftpConnectionList[0].id;
                    panels.left.path = '/';
                    document.getElementById(panels.left.select).value = panels.left.connId;
                    loadPanelDirectory('left');
                }
                if (!panels.right.connId && sftpConnectionList.length >= 2) {
                    panels.right.connId = sftpConnectionList[1].id;
                    panels.right.path = '/';
                    document.getElementById(panels.right.select).value = panels.right.connId;
                    loadPanelDirectory('right');
                }
            }
        }

        function onPanelConnChange(panel) {
            const sel = document.getElementById(panels[panel].select);
            const connId = sel.value;
            if (!connId) {
                panels[panel].connId = null;
                panels[panel].path = '/';
                document.getElementById(panels[panel].tbody).innerHTML = '';
                document.getElementById(panels[panel].status).innerHTML = '';
                document.getElementById(panels[panel].breadcrumb).innerHTML = '';
                return;
            }
            panels[panel].connId = connId;
            panels[panel].path = '/';
            document.getElementById(panels[panel].status).innerHTML = '<span class="conn-status">Connecting...</span>';
            loadPanelDirectory(panel);
        }

        async function loadPanelDirectory(panel, path) {
            const p = panels[panel];
            const connId = p.connId;
            if (!connId) return;
            if (path !== undefined) p.path = path;

            // Build breadcrumb
            const bcEl = document.getElementById(p.breadcrumb);
            const parts = p.path.split('/').filter(Boolean);
            let bcHtml = `<a href="#" onclick="navigatePanel('${panel}','/'); return false;">/</a>`;
            let cum = '';
            for (const part of parts) {
                cum += '/' + part;
                bcHtml += `<span>/</span><a href="#" onclick="navigatePanel('${panel}','${escapeJs(cum)}'); return false;">${escapeHtml(part)}</a>`;
            }
            bcEl.innerHTML = bcHtml;

            try {
                const base = sftpApiBase(connId);
                const res = await fetch(`${base}/list?path=${encodeURIComponent(p.path)}`, { credentials: 'include' });
                if (res.status === 401) { window.location.href = '/login'; return; }
                if (!res.ok) {
                    const d = await res.json();
                    document.getElementById(p.status).innerHTML = `<span class="conn-status error">${escapeHtml(d.error)}</span>`;
                    return;
                }
                document.getElementById(p.status).innerHTML = '<span class="conn-status connected">Connected</span>';
                const entries = await res.json();
                renderPanelFiles(panel, entries);
            } catch (e) {
                document.getElementById(p.status).innerHTML = '<span class="conn-status error">Connection failed</span>';
            }
        }

        function navigatePanel(panel, path) {
            panels[panel].path = path;
            loadPanelDirectory(panel, path);
        }

        function renderPanelFiles(panel, entries) {
            const p = panels[panel];
            const tbody = document.getElementById(p.tbody);
            const connId = p.connId;
            const isCompact = (panel === 'left' || panel === 'right');
            const isVod = isVodConn(connId);
            let html = '';

            if (p.path !== '/') {
                const parent = p.path.replace(/\/[^/]+\/?$/, '') || '/';
                html += `<tr ondblclick="navigatePanel('${panel}','${escapeJs(parent)}')">
                    <td><span class="file-name">${fileIcon('directory')} <strong>..</strong></span></td>
                    <td>-</td><td>-</td>${isCompact ? '' : '<td>-</td>'}<td></td>
                </tr>`;
            }

            html += entries.map(e => {
                const fullPath = joinPath(p.path, e.name);
                const jsPath = escapeJs(fullPath);
                const jsName = escapeJs(e.name);
                const dblClick = e.type === 'directory' ? `ondblclick="navigatePanel('${panel}','${jsPath}')"` : '';
                const base = sftpApiBase(connId);
                const dlUrl = `${base}/download?path=${encodeURIComponent(fullPath)}`;

                const actions = [];
                if (e.type === 'file') {
                    actions.push(`<button class="btn-sm" onclick="editPanelFile('${panel}','${jsPath}')">Edit</button>`);
                    actions.push(`<a class="btn-sm" href="${dlUrl}" style="text-decoration:none;">DL</a>`);
                }
                actions.push(`<button class="btn-sm" onclick="renamePanelFile('${panel}','${jsPath}','${jsName}')">Rename</button>`);
                actions.push(`<button class="btn-sm btn-danger" onclick="deletePanelFile('${panel}','${jsPath}','${jsName}')">Del</button>`);

                return `<tr ${dblClick}>
                    <td><span class="file-name">${fileIcon(e.type)} ${escapeHtml(e.name)}</span></td>
                    <td>${e.type === 'file' ? formatBytes(e.size) : '-'}</td>
                    <td>${formatDate(e.modified)}</td>
                    ${isCompact ? '' : `<td style="font-family:monospace;font-size:0.8rem;">${escapeHtml(e.permissions || '')}</td>`}
                    <td style="display:flex;gap:0.25rem;flex-wrap:wrap;" onclick="event.stopPropagation()">${actions.join('')}</td>
                </tr>`;
            }).join('');

            tbody.innerHTML = html;
        }

        function refreshPanel(panel) {
            if (panels[panel].connId) loadPanelDirectory(panel);
        }

        async function editPanelFile(panel, path) {
            const connId = panels[panel].connId;
            const base = sftpApiBase(connId);
            try {
                const res = await fetch(`${base}/read?path=${encodeURIComponent(path)}`, { credentials: 'include' });
                if (!res.ok) { const d = await res.json(); showToast(d.error || 'Cannot read file', 'error'); return; }
                const data = await res.json();
                editingFile = { path, mode: 'sftp', connId, panel };
                document.getElementById('edit-modal-title').textContent = 'Edit: ' + path.split('/').pop();
                document.getElementById('edit-textarea').value = data.content;
                document.getElementById('edit-modal').style.display = 'flex';
            } catch (e) {
                showToast('Failed to read file', 'error');
            }
        }

        async function deletePanelFile(panel, path, name) {
            if (!confirm(`Delete "${name}" on remote?`)) return;
            const connId = panels[panel].connId;
            const base = sftpApiBase(connId);
            try {
                const res = await fetch(`${base}/delete?path=${encodeURIComponent(path)}`, { method: 'DELETE', credentials: 'include' });
                const data = await res.json();
                if (res.ok) { showToast('Deleted ' + name, 'success'); loadPanelDirectory(panel); }
                else showToast(data.error, 'error');
            } catch (e) { showToast('Delete failed', 'error'); }
        }

        async function renamePanelFile(panel, path, oldName) {
            const connId = panels[panel].connId;
            const newName = prompt('New name:', oldName);
            if (!newName || newName === oldName) return;
            const dir = path.replace(/\/[^/]+$/, '') || '/';
            const newPath = joinPath(dir, newName);
            const base = sftpApiBase(connId);
            try {
                const res = await fetch(`${base}/rename`, {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ old_path: path, new_path: newPath })
                });
                const data = await res.json();
                if (res.ok) { showToast('Renamed', 'success'); loadPanelDirectory(panel); }
                else showToast(data.error, 'error');
            } catch (e) { showToast('Rename failed', 'error'); }
        }

        async function panelNewFolder(panel) {
            const connId = panels[panel].connId;
            if (!connId) { showToast('Select a connection first', 'error'); return; }
            const name = prompt('Folder name:');
            if (!name) return;
            const path = joinPath(panels[panel].path, name);
            const base = sftpApiBase(connId);
            try {
                const res = await fetch(`${base}/mkdir`, {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path })
                });
                const data = await res.json();
                if (res.ok) { showToast('Folder created', 'success'); loadPanelDirectory(panel); }
                else showToast(data.error, 'error');
            } catch (e) { showToast('Failed to create folder', 'error'); }
        }

        async function panelUploadFiles(panel, files) {
            const connId = panels[panel].connId;
            if (!connId) { showToast('Select a connection first', 'error'); return; }
            const base = sftpApiBase(connId);
            for (const file of files) {
                const formData = new FormData();
                formData.append('path', panels[panel].path);
                formData.append('file', file);
                try {
                    const res = await fetch(`${base}/upload`, { method: 'POST', credentials: 'include', body: formData });
                    const data = await res.json();
                    if (!res.ok) showToast(`Upload ${file.name}: ${data.error}`, 'error');
                } catch (e) { showToast(`Upload ${file.name} failed`, 'error'); }
            }
            showToast('Upload complete', 'success');
            loadPanelDirectory(panel);
            document.getElementById(panels[panel].upload).value = '';
        }

        // ===== EDIT MODAL =====

        async function saveEditedFile() {
            if (!editingFile) return;
            const content = document.getElementById('edit-textarea').value;

            try {
                const base = sftpApiBase(editingFile.connId);
                const res = await fetch(`${base}/write`, {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: editingFile.path, content })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('File saved', 'success');
                    closeEditModal();
                    if (editingFile.panel) loadPanelDirectory(editingFile.panel);
                } else {
                    showToast(data.error || 'Save failed', 'error');
                }
            } catch (e) {
                showToast('Save failed', 'error');
            }
        }

        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            editingFile = null;
        }

        // ===== INIT =====

        document.addEventListener('DOMContentLoaded', async () => {
            // Navbar toggle
            const toggle = document.querySelector('.navbar-toggle');
            const menu = document.querySelector('.navbar-menu');
            if (toggle && menu) {
                toggle.addEventListener('click', () => {
                    const expanded = toggle.getAttribute('aria-expanded') === 'true';
                    toggle.setAttribute('aria-expanded', !expanded);
                    menu.classList.toggle('active');
                });
            }

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeEditModal();
            });

            // Load user info
            try {
                const response = await fetch('/api/me', { credentials: 'include' });
                if (response.ok) {
                    const user = await response.json();
                    document.getElementById('username-display').textContent = user.nickname || user.username;
                    isAdmin = Portal.isAdmin(user);
                    if (isAdmin) {
                        const termBtn = document.getElementById('terminal-btn');
                        const badge = document.getElementById('admin-badge');
                        if (termBtn) termBtn.style.display = '';
                        if (badge) badge.style.display = '';
                    }
                    // Always start on SFTP tab
                    document.getElementById('tab-sftp').classList.add('active');
                    loadSftpConnections();
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
