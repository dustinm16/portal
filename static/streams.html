<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gateway - Community Streams</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=20">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        .streams-container {
            display: grid;
            grid-template-columns: 1fr;
            min-height: calc(100vh - 60px);
            background: var(--bg-primary);
        }

        .streams-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background: var(--bg-secondary);
        }

        .streams-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .streams-header h1 svg {
            width: 28px;
            height: 28px;
            color: var(--accent-blue);
        }

        .streams-header p {
            margin: 0;
            color: var(--text-muted);
        }

        .streams-content {
            padding: 2rem;
        }

        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .stream-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .stream-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .stream-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .stream-thumbnail svg {
            width: 64px;
            height: 64px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        .stream-live-badge {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: #ef4444;
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .stream-live-badge .pulse {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .stream-viewers {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .stream-viewers svg {
            width: 14px;
            height: 14px;
            opacity: 1;
        }

        .stream-info {
            padding: 1rem;
        }

        .stream-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
        }

        .stream-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0 0 0.75rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .stream-broadcaster {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stream-broadcaster-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Empty state */
        .streams-empty {
            text-align: center;
            padding: 4rem 2rem;
        }

        .streams-empty svg {
            width: 80px;
            height: 80px;
            color: var(--text-muted);
            opacity: 0.5;
            margin-bottom: 1.5rem;
        }

        .streams-empty h2 {
            color: var(--text-primary);
            margin: 0 0 0.5rem 0;
        }

        .streams-empty p {
            color: var(--text-muted);
            margin: 0;
        }

        /* Loading */
        .streams-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            gap: 1rem;
        }

        /* Stream Viewer Modal */
        .viewer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
        }

        .viewer-overlay.active {
            display: flex;
        }

        .viewer-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .viewer-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .viewer-header-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .viewer-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .viewer-header .stream-broadcaster {
            font-size: 0.9rem;
        }

        .viewer-close {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background 0.2s;
        }

        .viewer-close:hover {
            background: rgba(255,255,255,0.2);
        }

        .viewer-video {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-video video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Chat sidebar */
        .viewer-chat {
            width: 350px;
            background: var(--bg-secondary);
            border-left: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .viewer-chat-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 600;
        }

        .viewer-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .chat-message {
            padding: 0.5rem;
            border-radius: 6px;
            background: rgba(0,0,0,0.2);
        }

        .chat-message-header {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .chat-username {
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 0.85rem;
        }

        .chat-time {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .chat-text {
            color: var(--text-primary);
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .viewer-chat-input {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .viewer-chat-input input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .viewer-chat-input input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .viewer-chat-input button {
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        .viewer-chat-input button:hover {
            background: #2563eb;
        }

        /* Stream offline state */
        .stream-offline {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .stream-offline svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .viewer-container {
                flex-direction: column;
            }

            .viewer-chat {
                width: 100%;
                height: 300px;
            }

            .viewer-video {
                aspect-ratio: 16/9;
                flex: none;
            }
        }

        @media (max-width: 600px) {
            .streams-grid {
                grid-template-columns: 1fr;
            }

            .streams-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/dashboard" style="display: flex; align-items: center; gap: 0.5rem; color: inherit; text-decoration: none;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
                </svg>
                Portal Gateway
            </a>
        </div>
        <div class="navbar-menu">
            <a href="/dashboard">Dashboard</a>
            <a href="/chat">Chat</a>
            <a href="/streams" class="active">Streams</a>
            <a href="/docs">API Docs</a>
            <span id="username-display" style="color: var(--text-muted);"></span>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="streams-container">
        <div class="streams-header">
            <h1>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Community Streams
            </h1>
            <p>Watch live broadcasts from the community. Click on a stream to start watching.</p>
        </div>

        <div class="streams-content">
            <div id="streams-loading" class="streams-loading">
                <div class="spinner"></div>
                <span>Loading streams...</span>
            </div>

            <div id="streams-grid" class="streams-grid" style="display: none;"></div>

            <div id="streams-empty" class="streams-empty" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                <h2>No Live Streams</h2>
                <p>No one is streaming right now. Check back later!</p>
            </div>
        </div>
    </div>

    <!-- Stream Viewer Overlay -->
    <div id="viewer-overlay" class="viewer-overlay">
        <div class="viewer-container">
            <div class="viewer-main">
                <div class="viewer-header">
                    <div class="viewer-header-info">
                        <h2 id="viewer-title">Stream Title</h2>
                        <div class="stream-broadcaster">
                            <div class="stream-broadcaster-avatar" id="viewer-avatar">?</div>
                            <span id="viewer-broadcaster">Broadcaster</span>
                        </div>
                    </div>
                    <button class="viewer-close" onclick="closeViewer()">&times;</button>
                </div>
                <div class="viewer-video">
                    <video id="stream-video" controls autoplay></video>
                </div>
            </div>
            <div class="viewer-chat">
                <div class="viewer-chat-header">Stream Chat</div>
                <div class="viewer-chat-messages" id="chat-messages"></div>
                <form class="viewer-chat-input" onsubmit="sendChatMessage(event)">
                    <input type="text" id="chat-input" placeholder="Send a message..." autocomplete="off">
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentStream = null;
        let chatWs = null;
        let hlsPlayer = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserInfo();
            await loadStreams();

            // Auto-refresh every 30 seconds
            setInterval(loadStreams, 30000);
        });

        async function loadUserInfo() {
            try {
                const response = await fetch('/api/me', { credentials: 'include' });
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                currentUser = await response.json();
                document.getElementById('username-display').textContent = currentUser.nickname || currentUser.username;
            } catch (error) {
                console.error('Failed to load user:', error);
            }
        }

        async function loadStreams() {
            const loadingEl = document.getElementById('streams-loading');
            const gridEl = document.getElementById('streams-grid');
            const emptyEl = document.getElementById('streams-empty');

            // Only show loading on first load
            if (gridEl.innerHTML === '') {
                loadingEl.style.display = 'flex';
            }

            try {
                const response = await fetch('/api/streams/public', { credentials: 'include' });
                const data = await response.json();
                const streams = data.streams || [];

                loadingEl.style.display = 'none';

                if (streams.length === 0) {
                    gridEl.style.display = 'none';
                    emptyEl.style.display = 'block';
                    return;
                }

                emptyEl.style.display = 'none';
                gridEl.style.display = 'grid';
                gridEl.innerHTML = streams.map(renderStreamCard).join('');

            } catch (error) {
                console.error('Failed to load streams:', error);
                loadingEl.style.display = 'none';
                emptyEl.style.display = 'block';
            }
        }

        function renderStreamCard(stream) {
            const initial = (stream.owner_username || '?')[0].toUpperCase();
            return `
                <div class="stream-card" onclick="openStream(${stream.id})">
                    <div class="stream-thumbnail">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        ${stream.is_live ? `
                            <div class="stream-live-badge">
                                <span class="pulse"></span>
                                LIVE
                            </div>
                            <div class="stream-viewers">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                ${stream.viewer_count || 0}
                            </div>
                        ` : ''}
                    </div>
                    <div class="stream-info">
                        <h3 class="stream-title">${escapeHtml(stream.name)}</h3>
                        ${stream.description ? `<p class="stream-description">${escapeHtml(stream.description)}</p>` : ''}
                        <div class="stream-broadcaster">
                            <div class="stream-broadcaster-avatar">${initial}</div>
                            ${escapeHtml(stream.owner_username || 'Unknown')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function openStream(streamId) {
            try {
                const response = await fetch(`/api/streams/${streamId}`, { credentials: 'include' });
                const data = await response.json();
                currentStream = data.stream;

                if (!currentStream) {
                    alert('Stream not found');
                    return;
                }

                // Update viewer UI
                document.getElementById('viewer-title').textContent = currentStream.name;
                document.getElementById('viewer-broadcaster').textContent = currentStream.owner_username || 'Unknown';
                document.getElementById('viewer-avatar').textContent = (currentStream.owner_username || '?')[0].toUpperCase();

                // Clear previous chat
                document.getElementById('chat-messages').innerHTML = '';

                // Show viewer
                document.getElementById('viewer-overlay').classList.add('active');

                // Set up video
                const video = document.getElementById('stream-video');

                if (!currentStream.is_live) {
                    video.parentElement.innerHTML = `
                        <div class="stream-offline">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
                            </svg>
                            <p>This stream is currently offline</p>
                        </div>
                    `;
                } else {
                    // Use HLS for playback
                    const hlsUrl = `https://${window.location.hostname}:8888/${currentStream.stream_key}/index.m3u8`;

                    if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // Native HLS support (Safari)
                        video.src = hlsUrl;
                    } else if (Hls.isSupported()) {
                        // Use hls.js
                        if (hlsPlayer) {
                            hlsPlayer.destroy();
                        }
                        hlsPlayer = new Hls();
                        hlsPlayer.loadSource(hlsUrl);
                        hlsPlayer.attachMedia(video);
                    } else {
                        video.parentElement.innerHTML = `
                            <div class="stream-offline">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                </svg>
                                <p>Your browser doesn't support HLS playback</p>
                            </div>
                        `;
                    }
                }

                // Connect to chat if channel exists
                if (currentStream.chat_channel_id) {
                    connectChat(currentStream.chat_channel_id);
                }

            } catch (error) {
                console.error('Failed to open stream:', error);
                alert('Failed to load stream');
            }
        }

        function closeViewer() {
            document.getElementById('viewer-overlay').classList.remove('active');

            // Clean up video
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }

            const video = document.getElementById('stream-video');
            if (video) {
                video.pause();
                video.src = '';
            }

            // Disconnect chat
            if (chatWs) {
                chatWs.close();
                chatWs = null;
            }

            currentStream = null;
        }

        function connectChat(channelId) {
            if (chatWs) {
                chatWs.close();
            }

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            chatWs = new WebSocket(`${protocol}//${location.host}/ws/chat`);

            chatWs.onopen = () => {
                chatWs.send(JSON.stringify({
                    type: 'join',
                    channel_id: channelId
                }));
            };

            chatWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleChatMessage(data);
            };

            chatWs.onclose = () => {
                chatWs = null;
            };
        }

        function handleChatMessage(data) {
            switch (data.type) {
                case 'message':
                    appendChatMessage(data);
                    break;
                case 'history':
                    const container = document.getElementById('chat-messages');
                    container.innerHTML = '';
                    (data.messages || []).forEach(msg => appendChatMessage(msg, false));
                    container.scrollTop = container.scrollHeight;
                    break;
            }
        }

        function appendChatMessage(msg, scroll = true) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'chat-message';

            const time = formatTime(msg.created_at);
            const displayName = msg.nickname || msg.username;

            div.innerHTML = `
                <div class="chat-message-header">
                    <span class="chat-username">${escapeHtml(displayName)}</span>
                    <span class="chat-time">${time}</span>
                </div>
                <div class="chat-text">${escapeHtml(msg.message)}</div>
            `;

            container.appendChild(div);
            if (scroll) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function sendChatMessage(event) {
            event.preventDefault();

            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message || !chatWs || chatWs.readyState !== WebSocket.OPEN) return;

            chatWs.send(JSON.stringify({
                type: 'message',
                message: message
            }));

            input.value = '';
        }

        function formatTime(isoString) {
            if (!isoString) return '';
            let dateStr = isoString;
            if (!dateStr.includes('+') && !dateStr.endsWith('Z')) {
                dateStr = dateStr + 'Z';
            }
            const date = new Date(dateStr);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Close viewer with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('viewer-overlay').classList.contains('active')) {
                closeViewer();
            }
        });
    </script>
</body>
</html>
