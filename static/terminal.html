<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SERVICE_NAME}} - Open Relay Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="/static/css/portal.css?v=27">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }
        #terminal-container {
            height: calc(100vh - 50px);
        }
        .xterm {
            height: 100%;
            padding: 8px;
        }
    </style>
</head>
<body class="terminal-page">
    <header class="terminal-header">
        <div class="terminal-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span id="service-name">{{SERVICE_NAME}}</span>
        </div>
        <div class="terminal-controls">
            <div class="connection-status connecting" id="connection-status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
            <button class="btn btn-secondary" onclick="reconnect()" title="Reconnect">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <button class="btn btn-secondary" onclick="window.close()" title="Close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </header>

    <div id="terminal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="/static/js/portal.js"></script>
    <script src="/static/js/terminal.js"></script>
    <script>
        // Initialize terminal with service ID and WS path from server
        const serviceId = '{{SERVICE_ID}}';
        const wsPath = '{{WS_PATH}}';
        initTerminal(serviceId, wsPath);
    </script>
</body>
</html>
