<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Open Relay Portal - Unauthorized</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=54">
    <script src="/static/js/theme.js?v=3"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: rgba(var(--accent-blue-rgb), 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(var(--accent-blue-rgb), 0.3);
        }

        .icon svg {
            width: 60px;
            height: 60px;
            stroke: var(--accent-blue);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .status-code {
            font-size: 1rem;
            color: var(--accent-blue);
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .info-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: left;
            margin-bottom: 2rem;
        }

        .info-box h3 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .info-box code {
            display: block;
            background: var(--code-bg);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.8rem;
            color: var(--code-text);
            overflow-x: auto;
            margin-bottom: 0.5rem;
        }

        .info-box code:last-child {
            margin-bottom: 0;
        }

        .portal-name {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(var(--accent-blue-rgb), 0.1);
            border: 1px solid rgba(var(--accent-blue-rgb), 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            color: var(--accent-blue);
            margin-bottom: 1.5rem;
        }

        .portal-name svg {
            width: 14px;
            height: 14px;
        }
    </style>
</head>
<body>
    <div data-theme-mount class="theme-mount-corner"></div>
    <script>if (window.ThemeSwitcher) ThemeSwitcher.init();</script>
    <div class="container">
        <div class="portal-name">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
            </svg>
            Open Relay Portal
        </div>

        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>

        <h1>Access Denied</h1>
        <div class="status-code">401 Unauthorized</div>

        <p>
            This gateway requires authentication. Please provide a valid access token to continue.
        </p>

        <div class="info-box">
            <h3>Authentication Methods</h3>
            <code>Authorization: Bearer &lt;token&gt;</code>
            <code>wss://portal.example.com/?token=&lt;token&gt;</code>
        </div>
    </div>
</body>
</html>
