<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SERVICE_NAME}} - Open Relay Portal</title>
    <link rel="stylesheet" href="/static/css/portal.css?v=29">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
        }
        .proxmox-container {
            height: calc(100vh - 50px);
            display: flex;
        }
        .node-sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
        }
        .node-section {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .node-header {
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .node-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .node-header .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .node-header .status-dot.online {
            background: var(--accent-green);
        }
        .node-header .status-dot.offline {
            background: var(--accent-red);
        }
        .node-name {
            font-weight: 500;
            flex: 1;
        }
        .vm-list {
            padding: 0 0.5rem 0.5rem;
        }
        .vm-item {
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .vm-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .vm-item.selected {
            background: rgba(96, 165, 250, 0.2);
            border: 1px solid rgba(96, 165, 250, 0.3);
        }
        .vm-item .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .vm-item .status-dot.running {
            background: var(--accent-green);
        }
        .vm-item .status-dot.stopped {
            background: var(--accent-red);
        }
        .vm-item .status-dot.paused {
            background: var(--status-connecting);
        }
        .vm-icon {
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }
        .vm-info {
            flex: 1;
            min-width: 0;
        }
        .vm-name {
            font-size: 0.875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vm-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow-y: auto;
        }
        .detail-header {
            margin-bottom: 1.5rem;
        }
        .detail-header h2 {
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }
        .detail-header .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
        }
        .status-badge.running {
            background: rgba(34, 197, 94, 0.1);
            color: var(--accent-green);
        }
        .status-badge.stopped {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
        }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
        }
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 500;
            margin-top: 0.25rem;
        }
        .console-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        .no-selection {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }
        .no-selection svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body class="proxmox-page">
    <header class="terminal-header">
        <div class="terminal-title">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
            </svg>
            <span id="service-name">{{SERVICE_NAME}}</span>
        </div>
        <div class="terminal-controls">
            <div class="connection-status connecting" id="connection-status">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
            <button class="btn btn-secondary" onclick="refresh()" title="Refresh">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <button class="btn btn-secondary" onclick="window.close()" title="Close">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="16" height="16">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </header>

    <div class="proxmox-container">
        <div class="node-sidebar" id="node-sidebar">
            <div style="padding: 1rem; color: var(--text-muted);">Loading...</div>
        </div>

        <div class="main-panel" id="main-panel">
            <div class="no-selection">
                <div>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                    </svg>
                    <p>Select a VM or container</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/portal.js"></script>
    <script>
        const serviceId = '{{SERVICE_ID}}';
        const wsPath = '{{WS_PATH}}';
        let ws = null;
        let clusterData = null;
        let selectedVm = null;

        document.addEventListener('DOMContentLoaded', () => {
            connect();
        });

        function connect() {
            updateStatus('connecting', 'Connecting...');

            const wsUrl = Portal.getWebSocketUrl(wsPath);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                updateStatus('connected', 'Connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Invalid message:', e);
                }
            };

            ws.onclose = () => {
                updateStatus('disconnected', 'Disconnected');
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('disconnected', 'Error');
            };
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'cluster':
                    clusterData = data;
                    renderSidebar();
                    break;

                case 'status':
                    if (selectedVm && selectedVm.vmid === data.vmid) {
                        renderVmDetail(selectedVm.node, selectedVm.vmid, selectedVm.type, data.status);
                    }
                    break;

                case 'vnc_ticket':
                    openVncConsole(data);
                    break;

                case 'spice_ticket':
                    openSpiceConsole(data);
                    break;

                case 'power_result':
                    if (data.success) {
                        Portal.toast(`${data.command} successful`, 'info');
                        setTimeout(refresh, 2000);
                    } else {
                        Portal.toast(`${data.command} failed`, 'error');
                    }
                    break;

                case 'error':
                    Portal.toast(data.message, 'error');
                    break;
            }
        }

        function renderSidebar() {
            const sidebar = document.getElementById('node-sidebar');

            if (!clusterData || !clusterData.nodes || clusterData.nodes.length === 0) {
                sidebar.innerHTML = '<div style="padding: 1rem; color: var(--text-muted);">No nodes found</div>';
                return;
            }

            sidebar.innerHTML = clusterData.nodes.map(node => `
                <div class="node-section">
                    <div class="node-header">
                        <span class="status-dot ${node.status === 'online' ? 'online' : 'offline'}"></span>
                        <span class="node-name">${node.name}</span>
                    </div>
                    <div class="vm-list">
                        ${node.vms.map(vm => renderVmItem(node.name, vm, 'qemu')).join('')}
                        ${node.containers.map(ct => renderVmItem(node.name, ct, 'lxc')).join('')}
                    </div>
                </div>
            `).join('');
        }

        function renderVmItem(nodeName, vm, type) {
            const statusClass = vm.status === 'running' ? 'running' : (vm.status === 'paused' ? 'paused' : 'stopped');
            const icon = type === 'qemu' ?
                '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="vm-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>' :
                '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="vm-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" /></svg>';

            return `
                <div class="vm-item" onclick="selectVm('${nodeName}', ${vm.vmid}, '${type}')">
                    <span class="status-dot ${statusClass}"></span>
                    ${icon}
                    <div class="vm-info">
                        <div class="vm-name">${vm.name}</div>
                        <div class="vm-meta">${type.toUpperCase()} ${vm.vmid}</div>
                    </div>
                </div>
            `;
        }

        function selectVm(node, vmid, type) {
            selectedVm = { node, vmid, type };

            // Find VM data
            const nodeData = clusterData.nodes.find(n => n.name === node);
            const vmList = type === 'qemu' ? nodeData.vms : nodeData.containers;
            const vm = vmList.find(v => v.vmid === vmid);

            renderVmDetail(node, vmid, type, vm);

            // Request fresh status
            ws.send(JSON.stringify({
                command: 'status',
                node: node,
                vmid: vmid,
                type: type
            }));
        }

        function renderVmDetail(node, vmid, type, status) {
            const panel = document.getElementById('main-panel');
            const statusClass = status.status === 'running' ? 'running' : 'stopped';

            const cpuPercent = status.cpu ? (status.cpu * 100).toFixed(1) : 0;
            const memUsed = status.mem ? formatBytes(status.mem) : '0';
            const memMax = status.maxmem ? formatBytes(status.maxmem) : '0';
            const uptime = status.uptime ? formatUptime(status.uptime) : 'N/A';

            panel.innerHTML = `
                <div class="detail-header">
                    <h2>${status.name || `${type.toUpperCase()} ${vmid}`}</h2>
                    <span class="status-badge ${statusClass}">
                        <span class="status-dot"></span>
                        ${status.status || 'Unknown'}
                    </span>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">CPU Usage</div>
                        <div class="value">${cpuPercent}%</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Memory</div>
                        <div class="value">${memUsed} / ${memMax}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Uptime</div>
                        <div class="value">${uptime}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Node</div>
                        <div class="value">${node}</div>
                    </div>
                </div>

                <div class="action-buttons">
                    ${status.status === 'running' ? `
                        <button class="btn btn-secondary" onclick="powerAction('shutdown')">Shutdown</button>
                        <button class="btn btn-secondary" onclick="powerAction('stop')">Stop</button>
                        <button class="btn btn-secondary" onclick="powerAction('reset')">Reset</button>
                    ` : `
                        <button class="btn btn-primary" onclick="powerAction('start')">Start</button>
                    `}
                </div>

                <div class="console-buttons">
                    <button class="btn btn-primary" onclick="openConsole('vnc')" ${status.status !== 'running' ? 'disabled' : ''}>
                        Open VNC Console
                    </button>
                    ${type === 'qemu' ? `
                        <button class="btn btn-secondary" onclick="openConsole('spice')" ${status.status !== 'running' ? 'disabled' : ''}>
                            Open SPICE Console
                        </button>
                    ` : ''}
                </div>
            `;
        }

        function powerAction(action) {
            if (!selectedVm) return;

            if (!confirm(`Are you sure you want to ${action} this VM?`)) {
                return;
            }

            ws.send(JSON.stringify({
                command: action,
                node: selectedVm.node,
                vmid: selectedVm.vmid,
                type: selectedVm.type
            }));
        }

        function openConsole(consoleType) {
            if (!selectedVm) return;

            ws.send(JSON.stringify({
                command: consoleType,
                node: selectedVm.node,
                vmid: selectedVm.vmid,
                type: selectedVm.type
            }));
        }

        function openVncConsole(data) {
            // For now, show the ticket info
            // In a full implementation, you would open the VNC viewer
            alert(`VNC Ticket: ${data.ticket}\nPort: ${data.port}`);
        }

        function openSpiceConsole(data) {
            // For now, show the ticket info
            alert('SPICE ticket received. Use a SPICE client to connect.');
        }

        function refresh() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'refresh' }));
            }
        }

        function formatBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(1)} ${units[i]}`;
        }

        function formatUptime(seconds) {
            const days = Math.floor(seconds / 86400);
            const hours = Math.floor((seconds % 86400) / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);

            if (days > 0) return `${days}d ${hours}h`;
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m`;
        }

        function updateStatus(status, text) {
            const statusEl = document.getElementById('connection-status');
            const statusText = document.getElementById('status-text');
            statusEl.className = `connection-status ${status}`;
            statusText.textContent = text;
        }

        window.addEventListener('beforeunload', () => {
            if (ws) ws.close(1000, 'Page closed');
        });
    </script>
</body>
</html>
